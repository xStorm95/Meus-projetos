<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sem conexão — PASSARELA ERP</title>
  <style>
    body{margin:0;display:flex;min-height:100vh;align-items:center;justify-content:center;
      background:#faf8f5;font-family:system-ui,-apple-system,sans-serif;color:#1a1a1f;text-align:center;padding:24px}
    .badge{width:56px;height:56px;border-radius:16px;background:#c9a227;color:#fff;font-family:Georgia,serif;
      font-size:30px;font-weight:700;display:flex;align-items:center;justify-content:center;margin:0 auto 20px}
    h1{font-size:18px;margin:0 0 8px}p{font-size:13px;color:#6a6a74;max-width:340px;line-height:1.6;margin:0 auto}
    button{margin-top:20px;background:#c9a227;color:#fff;border:0;border-radius:12px;padding:10px 20px;
      font-size:14px;font-weight:600;cursor:pointer}
  </style>
</head>
<body>
  <div>
    <div class="badge">P</div>
    <h1>Você está sem conexão</h1>
    <p>O ERP precisa de conexão com a internet para consultar e gravar dados no servidor, garantindo que todas as informações fiquem centralizadas e seguras.</p>
    <button onclick="location.reload()">Tentar novamente</button>
  </div>
</body>
</html>
