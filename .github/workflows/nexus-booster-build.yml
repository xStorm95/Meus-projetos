name: Nexus Booster — Build Windows

on:
  workflow_dispatch:
  push:
    branches: ["main", "arena/*"]
    tags: ["nexus-booster-v*"]
    paths:
      - "NexusBooster/**"
      - ".github/workflows/nexus-booster-build.yml"

permissions:
  contents: write

jobs:
  build-windows:
    name: Compilar instalador (windows-latest)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: NexusBooster

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Instalar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: NexusBooster/requirements.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow

      - name: Gerar ícone (.ico)
        run: python tools/make_icon.py assets/icon.ico

      - name: Compilar executável (PyInstaller)
        run: pyinstaller --noconfirm --clean packaging/windows/nexusbooster.spec

      - name: Compilar instalador (Inno Setup 6)
        shell: cmd
        run: |
          if exist "%ProgramFiles(x86)%\Inno Setup 6\ISCC.exe" (
            "%ProgramFiles(x86)%\Inno Setup 6\ISCC.exe" packaging\installer\nexusbooster.iss
          ) else (
            "%ProgramFiles%\Inno Setup 6\ISCC.exe" packaging\installer\nexusbooster.iss
          )

      - name: Publicar no GitHub Releases
        # Cria a release da versão atual se ainda não existir (com o instalador).
        # Uma release já publicada NUNCA é sobrescrita — para publicar uma nova,
        # aumente a versão do app.
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION=$(python -c "from nexus.constants import APP_VERSION; print(APP_VERSION)")
          TAG="nexus-booster-v${VERSION}"
          ASSET="installer_output/NexusBooster-Setup-${VERSION}.exe"
          echo "Versão: ${VERSION}"
          ls -la installer_output || true
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release ${TAG} já existe — mantida intacta (aumente a versão para publicar outra)."
          else
            gh release create "$TAG" "$ASSET" -R "$GITHUB_REPOSITORY" \
              --title "Nexus Booster v${VERSION}" \
              --notes "Otimizador profissional de desempenho para Windows e jogos.

          **Instalação:** baixe \`NexusBooster-Setup-${VERSION}.exe\` abaixo, dê dois cliques e avance no assistente (atalho na área de trabalho opcional).

          - Windows 10 (1709+) ou Windows 11, 64 bits
          - Inclui desinstalador completo
          - FPS nos jogos: opcionalmente baixe o PresentMon (link dentro do app, aba FPS Monitor)
          - Recursos de administrador são opcionais (o app pede UAC quando necessário)" \
              --target "$GITHUB_SHA"
            echo "=== URL do download ==="
            gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].browser_download_url'
          fi

      - name: Enviar artefato (backup)
        uses: actions/upload-artifact@v4
        with:
          name: NexusBooster-Setup-${{ github.run_number }}
          path: NexusBooster/installer_output/NexusBooster-Setup-*.exe
          if-no-files-found: error
