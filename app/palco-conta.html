<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14121a">
<meta name="description" content="Palco — login, cadastro e perfil com foto. Seus dados salvos no seu dispositivo.">
<title>Palco · Sua conta</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2314121a'/%3E%3Ctext x='32' y='45' font-family='Georgia,serif' font-size='36' fill='%23eed48b' text-anchor='middle'%3EP%3C/text%3E%3C/svg%3E">
<style>
/* ============================================================
   Palco · Conta — login, cadastro e perfil
   Zero dependências. Funciona offline e em file://
   ============================================================ */

:root {
  --bg: #f6f5f2;
  --surface: #ffffff;
  --surface-2: #fbfaf8;
  --line: #e6e2db;
  --line-strong: #d5cfc5;
  --ink: #17161b;
  --ink-soft: #5f5b55;
  --ink-faint: #918b83;
  --brand: #1f1c26;
  --brand-ink: #f3ecdd;
  --accent: #b0873a;
  --accent-soft: #f5efe1;
  --accent-line: #e2d2ad;
  --ok: #1c7a52;
  --ok-soft: #e4f4ec;
  --bad: #b02a1f;
  --bad-soft: #fdecea;
  --wa: #9a6615;
  --wa-soft: #fdf3e0;
  --ring: rgba(176, 135, 58, 0.22);
  --shadow-1: 0 1px 2px rgba(23, 22, 27, 0.05);
  --shadow-2: 0 10px 30px -18px rgba(23, 22, 27, 0.3), 0 2px 8px rgba(23, 22, 27, 0.04);
  --shadow-3: 0 30px 70px -40px rgba(23, 22, 27, 0.55);
  --r-sm: 9px;
  --r: 13px;
  --r-lg: 20px;
  --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --serif: "Cormorant Garamond", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
}

html[data-theme="dark"] {
  --bg: #0f0e12;
  --surface: #17161c;
  --surface-2: #1d1c23;
  --line: #2a2831;
  --line-strong: #3a3743;
  --ink: #f2eee7;
  --ink-soft: #a8a29a;
  --ink-faint: #706b64;
  --brand: #08070b;
  --brand-ink: #f3ecdd;
  --accent: #d3ab5e;
  --accent-soft: #2a2317;
  --accent-line: #4a3d24;
  --ok: #57c295;
  --ok-soft: #12291f;
  --bad: #f18a7e;
  --bad-soft: #2e1512;
  --wa: #e0b062;
  --wa-soft: #2b2114;
  --ring: rgba(211, 171, 94, 0.25);
  --shadow-2: 0 10px 30px -18px rgba(0, 0, 0, 0.8);
  --shadow-3: 0 30px 70px -40px rgba(0, 0, 0, 0.9);
}

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 14.5px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  transition: background .3s ease, color .3s ease;
}
body[data-booting] { visibility: hidden; }

h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: -0.015em; }
p { margin: 0; }
a { color: var(--accent); text-decoration: none; font-weight: 550; }
a:hover { text-decoration: underline; }
button { font: inherit; cursor: pointer; }
input, textarea { font: inherit; color: inherit; }
::selection { background: var(--accent); color: #fff; }
.hidden { display: none !important; }
.muted { color: var(--ink-soft); }
.tiny { font-size: 11.5px; }
.stack { display: grid; gap: 12px; }

/* ------------------------------- layout ------------------------------- */

.shell { display: grid; grid-template-columns: 1.05fr 1fr; min-height: 100dvh; }
.panel {
  display: flex; align-items: center; justify-content: center;
  padding: 40px 24px; background: var(--bg); overflow-y: auto;
}

/* ------------------------------- marca ------------------------------- */

.brand {
  position: relative; overflow: hidden; display: flex; flex-direction: column;
  justify-content: space-between; padding: 40px 46px;
  background: radial-gradient(1200px 600px at 15% 10%, #2b2438 0%, transparent 55%),
              radial-gradient(900px 500px at 90% 90%, #40301a 0%, transparent 60%),
              linear-gradient(150deg, #14121a 0%, #191620 55%, #221a12 100%);
  color: var(--brand-ink);
}
.brand::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background-image: linear-gradient(rgba(255, 255, 255, .028) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(255, 255, 255, .028) 1px, transparent 1px);
  background-size: 46px 46px;
  mask-image: radial-gradient(70% 60% at 50% 40%, #000 35%, transparent 100%);
}
.brand > * { position: relative; z-index: 1; }
.brand-top { display: flex; align-items: center; justify-content: space-between; }
.brand-logo {
  display: flex; align-items: center; gap: 12px;
  font-family: var(--serif); font-size: 23px; letter-spacing: .2em; text-transform: uppercase;
}
.brand-mark {
  width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center;
  background: linear-gradient(145deg, #eed48b, #b0873a); color: #1a1409;
  font-family: var(--sans); font-size: 18px; font-weight: 800; letter-spacing: 0;
  box-shadow: 0 10px 26px -12px rgba(238, 212, 139, .85);
}
.brand-mark.sm { width: 30px; height: 30px; border-radius: 9px; font-size: 14px; box-shadow: none; }
.brand-theme { color: rgba(243, 236, 221, .7); border-color: rgba(243, 236, 221, .18); }
.brand-center { max-width: 460px; }
.brand h1 {
  font-family: var(--serif); font-size: 52px; line-height: 1.03; font-weight: 500; letter-spacing: -0.025em;
}
.brand h1 em { font-style: italic; color: #eed48b; }
.brand p { margin-top: 18px; font-size: 14.5px; line-height: 1.7; color: rgba(243, 236, 221, .72); }
.brand-list { list-style: none; margin: 32px 0 0; padding: 0; display: grid; gap: 14px; }
.brand-list li { display: flex; gap: 12px; align-items: flex-start; font-size: 13px; color: rgba(243, 236, 221, .8); }
.brand-list svg { color: #eed48b; flex-shrink: 0; margin-top: 2px; }
.brand-list strong { color: #f6efe2; font-weight: 600; }
.brand-foot { font-size: 11.5px; color: rgba(243, 236, 221, .42); }

/* ------------------------------- cards ------------------------------- */

.card {
  width: 100%; max-width: 460px; background: var(--surface);
  border: 1px solid var(--line); border-radius: var(--r-lg);
  box-shadow: var(--shadow-2); overflow: hidden;
  animation: rise .45s cubic-bezier(.2, .8, .2, 1) both;
}
@keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
.card-head { padding: 30px 32px 6px; }
.card-head h2 { font-family: var(--serif); font-size: 30px; font-weight: 600; letter-spacing: -0.02em; }
.card-head p { margin-top: 6px; font-size: 13px; color: var(--ink-soft); }
.card-foot {
  padding: 16px 32px 26px; font-size: 13px; color: var(--ink-soft); text-align: center;
}
.notice {
  display: flex; gap: 10px; align-items: flex-start; margin: 0 32px 26px;
  padding: 11px 13px; border-radius: var(--r-sm);
  background: var(--accent-soft); border: 1px solid var(--accent-line);
  color: var(--wa); font-size: 12px; line-height: 1.5;
}
.notice svg { flex-shrink: 0; margin-top: 1px; }

/* ------------------------------- forms ------------------------------- */

.form { padding: 20px 32px 26px; display: grid; gap: 15px; }
.field { display: grid; gap: 6px; }
.field label { font-size: 12.5px; font-weight: 600; color: var(--ink-soft); letter-spacing: .01em; }
.field .opt { font-weight: 400; color: var(--ink-faint); }
.control { position: relative; display: flex; align-items: center; }
.control > svg {
  position: absolute; left: 13px; color: var(--ink-faint); pointer-events: none; transition: color .18s;
}
.control input, .field textarea {
  width: 100%; padding: 11px 13px 11px 40px;
  background: var(--surface-2); color: var(--ink);
  border: 1px solid var(--line-strong); border-radius: var(--r-sm);
  outline: none; transition: border-color .16s, box-shadow .16s, background .16s;
}
.field textarea { padding-left: 13px; min-height: 82px; resize: vertical; }
.control input::placeholder, .field textarea::placeholder { color: var(--ink-faint); }
.control input:focus, .field textarea:focus {
  border-color: var(--accent); background: var(--surface); box-shadow: 0 0 0 3.5px var(--ring);
}
.control input:focus + svg, .control input:focus ~ svg { color: var(--accent); }
.control input.invalid { border-color: var(--bad); box-shadow: 0 0 0 3.5px var(--bad-soft); }
.reveal {
  position: absolute; right: 8px; display: grid; place-items: center;
  width: 30px; height: 30px; border: 0; border-radius: 7px;
  background: transparent; color: var(--ink-faint);
}
.reveal:hover { background: var(--line); color: var(--ink); }
.control input + .field-check, .control input ~ .field-check {
  position: absolute; right: 12px; display: grid; place-items: center;
}
.field-check.ok { color: var(--ok); }
.field-check.bad { color: var(--bad); }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; }
.error-slot {
  font-size: 11.5px; color: var(--bad); line-height: 1.4;
  max-height: 0; opacity: 0; overflow: hidden; transition: max-height .2s, opacity .2s;
}
.error-slot.show { max-height: 44px; opacity: 1; }
.counter { font-size: 11px; color: var(--ink-faint); text-align: right; }
.form-actions { display: flex; gap: 9px; align-items: center; flex-wrap: wrap; }

.strength { display: flex; gap: 5px; margin-top: 2px; }
.strength span { height: 4px; flex: 1; border-radius: 4px; background: var(--line); transition: background .25s; }
.strength[data-score="1"] span:nth-child(1) { background: var(--bad); }
.strength[data-score="2"] span:nth-child(-n+2) { background: var(--wa); }
.strength[data-score="3"] span:nth-child(-n+3) { background: #2b6ca3; }
.strength[data-score="4"] span { background: var(--ok); }
.strength-label { font-size: 11px; color: var(--ink-faint); }
.html-dark .strength-label { color: var(--ink-soft); }

/* ------------------------------- botões ------------------------------- */

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 11px 18px; border-radius: var(--r-sm); border: 1px solid transparent;
  font-size: 13.5px; font-weight: 600; line-height: 1.2;
  transition: transform .12s ease, background .18s, border-color .18s, box-shadow .18s, opacity .18s;
  white-space: nowrap;
}
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-primary {
  background: linear-gradient(180deg, #1f1c26, #14121a); color: #f6efe2;
  box-shadow: 0 8px 20px -12px rgba(23, 22, 27, .85), inset 0 1px 0 rgba(255, 255, 255, .07);
}
.btn-primary:hover:not(:disabled) { background: linear-gradient(180deg, #2a2533, #1b1822); }
html[data-theme="dark"] .btn-primary {
  background: linear-gradient(180deg, #eed48b, #c79f4d); color: #1a1409;
  box-shadow: 0 8px 22px -14px rgba(238, 212, 139, .8);
}
html[data-theme="dark"] .btn-primary:hover:not(:disabled) { background: linear-gradient(180deg, #f4dfa4, #d3ab5e); }
.btn-outline { background: var(--surface); color: var(--ink); border-color: var(--line-strong); }
.btn-outline:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.btn-ghost { background: transparent; color: var(--ink-soft); }
.btn-ghost:hover:not(:disabled) { background: var(--surface-2); color: var(--ink); }
.btn-danger { background: var(--bad); color: #fff; }
.btn-danger:hover:not(:disabled) { filter: brightness(1.08); }
.btn-danger-ghost { background: transparent; color: var(--bad); border-color: transparent; }
.btn-danger-ghost:hover { background: var(--bad-soft); }
.btn-block { width: 100%; }
.btn-sm { padding: 7px 12px; font-size: 12.5px; border-radius: 8px; }
.icon-btn {
  display: grid; place-items: center; width: 36px; height: 36px;
  border: 1px solid var(--line); border-radius: 10px;
  background: var(--surface); color: var(--ink-soft); transition: all .18s;
}
.icon-btn:hover { color: var(--ink); border-color: var(--line-strong); background: var(--surface-2); }
.spinner {
  width: 14px; height: 14px; border-radius: 50%;
  border: 2px solid currentColor; border-top-color: transparent;
  display: inline-block; animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ------------------------------- app / perfil ------------------------------- */

.app { min-height: 100dvh; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between;
  gap: 14px; padding: 12px 28px; border-bottom: 1px solid var(--line);
  background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: blur(14px);
}
.topbar-brand {
  display: flex; align-items: center; gap: 10px;
  font-family: var(--serif); font-size: 18px; letter-spacing: .18em; text-transform: uppercase;
}
.topbar-right { display: flex; align-items: center; gap: 10px; }
.account-chip { display: flex; align-items: center; gap: 9px; padding: 4px 12px 4px 4px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); }
.account-chip-text { display: grid; line-height: 1.25; }
.account-chip-text strong { font-size: 12.5px; }
.account-chip-text span { font-size: 10.5px; color: var(--ink-faint); }
.save-chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px;
  font-size: 11.5px; font-weight: 600; color: var(--ok); background: var(--ok-soft);
  transition: all .25s;
}
.save-chip.pulse { transform: scale(1.04); }

.view { width: 100%; max-width: 1120px; margin: 0 auto; padding: 26px 24px 70px; }
.hero {
  display: flex; align-items: center; justify-content: space-between; gap: 22px; flex-wrap: wrap;
  padding: 24px; border-radius: var(--r-lg); border: 1px solid var(--line);
  background:
    radial-gradient(700px 300px at 100% 0%, var(--accent-soft) 0%, transparent 62%),
    var(--surface);
  box-shadow: var(--shadow-1);
}
.hero-left { display: flex; align-items: center; gap: 20px; }
.hero-info h1 { font-family: var(--serif); font-size: 32px; font-weight: 600; letter-spacing: -0.02em; }
.hero-email { font-size: 13px; color: var(--ink-soft); margin-top: 3px; }
.chips { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 11px; }
.chip {
  display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 999px;
  font-size: 11px; font-weight: 500; color: var(--ink-soft);
  background: var(--surface-2); border: 1px solid var(--line);
}
.hero-actions { display: flex; gap: 8px; flex-wrap: wrap; }

.photo-block { position: relative; flex-shrink: 0; }
.avatar {
  display: grid; place-items: center; overflow: hidden; flex-shrink: 0;
  border-radius: 50%; background: var(--accent-soft); color: var(--accent);
  font-weight: 700; border: 1px solid var(--line-strong);
}
.avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
.avatar-sm { width: 32px; height: 32px; font-size: 12px; }
.avatar-md { width: 46px; height: 46px; font-size: 15px; }
.avatar-xl { width: 116px; height: 116px; font-size: 34px; border-width: 3px; }
.photo-badge {
  position: absolute; right: 0; bottom: 2px; width: 34px; height: 34px; border-radius: 50%;
  display: grid; place-items: center; background: var(--surface); color: var(--ink);
  border: 1px solid var(--line-strong); box-shadow: var(--shadow-2); transition: transform .16s;
}
.photo-badge:hover { transform: scale(1.07); border-color: var(--accent); color: var(--accent); }

.layout { display: grid; grid-template-columns: 1.55fr 1fr; gap: 18px; margin-top: 18px; align-items: start; }
.col-main, .col-side { display: grid; gap: 16px; }
.card-width-auto { max-width: none; }
.view .card { max-width: none; animation: none; }
.card-title {
  display: flex; align-items: center; gap: 9px; padding: 15px 20px;
  border-bottom: 1px solid var(--line);
}
.card-title svg { color: var(--accent); }
.card-title h2 { font-size: 14px; font-weight: 650; letter-spacing: -0.005em; }
.card-title > :last-child:not(h2):not(svg) { margin-left: auto; }
.badge-soft {
  font-size: 10.5px; font-weight: 600; color: var(--ok); background: var(--ok-soft);
  padding: 3px 9px; border-radius: 999px;
}
.card-body { padding: 18px 20px; }
.card-body.form-pad { padding: 18px 20px; }
.kv { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; font-size: 12.5px; }
.kv span { color: var(--ink-soft); }
.kv strong { font-weight: 600; text-align: right; }

.dropzone {
  display: grid; justify-items: center; gap: 5px; text-align: center;
  padding: 26px 18px; border-radius: var(--r); cursor: pointer;
  border: 1.5px dashed var(--line-strong); background: var(--surface-2);
  color: var(--ink-soft); transition: all .18s;
}
.dropzone svg { color: var(--ink-faint); }
.dropzone strong { font-size: 13px; color: var(--ink); font-weight: 600; }
.dropzone span { font-size: 11.5px; color: var(--ink-faint); }
.dropzone:hover, .dropzone:focus-visible, .dropzone.drag {
  border-color: var(--accent); background: var(--accent-soft); outline: none;
}
.dropzone.busy { opacity: .6; pointer-events: none; }
.photo-hint { margin-top: 4px; }
.photo-actions { display: flex; gap: 8px; margin-top: 13px; }

.danger-box {
  margin-top: 14px; padding: 14px; border-radius: var(--r);
  border: 1px solid var(--bad); background: var(--bad-soft); display: grid; gap: 10px;
}
.danger-box p { font-size: 12px; color: var(--bad); }
.danger-box .control input { background: var(--surface); }

/* ------------------------------- toasts ------------------------------- */

.toasts { position: fixed; z-index: 90; right: 20px; bottom: 20px; display: grid; gap: 9px; width: min(360px, calc(100vw - 32px)); }
.toast {
  display: flex; gap: 11px; align-items: flex-start; padding: 13px 15px;
  border-radius: var(--r); background: var(--surface); border: 1px solid var(--line);
  box-shadow: var(--shadow-3); animation: toast-in .28s cubic-bezier(.2, .9, .3, 1.1) both;
}
.toast.out { animation: toast-out .25s ease forwards; }
@keyframes toast-in { from { opacity: 0; transform: translateX(26px) scale(.98); } to { opacity: 1; transform: none; } }
@keyframes toast-out { to { opacity: 0; transform: translateX(26px); } }
.toast-content { display: grid; gap: 1px; }
.toast-content strong { font-size: 12.5px; }
.toast-content span { font-size: 12px; color: var(--ink-soft); line-height: 1.45; }
.toast-icon { flex-shrink: 0; margin-top: 1px; }
.toast-success { border-left: 3px solid var(--ok); }
.toast-success .toast-icon { color: var(--ok); }
.toast-error { border-left: 3px solid var(--bad); }
.toast-error .toast-icon { color: var(--bad); }
.toast-info { border-left: 3px solid var(--accent); }
.toast-info .toast-icon { color: var(--accent); }

/* ------------------------------- responsivo ------------------------------- */

@media (max-width: 980px) {
  .shell { grid-template-columns: 1fr; }
  .brand { display: none; }
  .layout { grid-template-columns: 1fr; }
  .panel { padding: 26px 16px; align-items: flex-start; padding-top: 8vh; }
}
@media (max-width: 620px) {
  .card-head { padding: 24px 22px 4px; }
  .form { padding: 16px 22px 22px; }
  .card-foot, .notice { padding-left: 22px; padding-right: 22px; }
  .notice { margin-left: 22px; margin-right: 22px; }
  .grid-2 { grid-template-columns: 1fr; }
  .topbar { padding: 10px 14px; }
  .account-chip-text { display: none; }
  .account-chip { padding: 3px; }
  .view { padding: 16px 14px 60px; }
  .hero { padding: 18px; }
  .hero-left { flex-direction: column; align-items: flex-start; gap: 14px; }
  .hero-info h1 { font-size: 26px; }
  .avatar-xl { width: 92px; height: 92px; font-size: 28px; }
  .brand h1 { font-size: 40px; }
  .save-chip { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
}

@media print {
  .topbar, .toasts, .hero-actions, .dropzone, .photo-actions { display: none !important; }
}

</style>
</head>
<body data-booting>
<div id="app"></div>
<div class="toasts" id="toasts"></div>
<noscript><p style="padding:28px;text-align:center;font-family:system-ui">Ative o JavaScript para usar sua conta.</p></noscript>
<script>
/*
 * Núcleo de validação e formatação — funções puras, sem DOM.
 * Roda no navegador e no Node (testes).
 */
(function (root, factory) {
  if (typeof module === "object" && module.exports) module.exports = factory();
  else root.AccountCore = factory();
})(typeof globalThis !== "undefined" ? globalThis : this, function () {
  "use strict";

  function onlyDigits(value) {
    return String(value === null || value === undefined ? "" : value).replace(/\D/g, "");
  }

  /* ------------------------------- E-mail ------------------------------- */

  function normalizeEmail(value) {
    return String(value || "").trim().toLowerCase();
  }

  function isValidEmail(value) {
    var email = normalizeEmail(value);
    if (email.length < 5 || email.length > 254) return false;
    if (/\s/.test(email)) return false;
    return /^[^\s@]+@[^\s@.]+(\.[^\s@.]+)*\.[A-Za-z]{2,}$/.test(email);
  }

  /* -------------------------------- Nome -------------------------------- */

  function normalizeName(value) {
    return String(value || "")
      .trim()
      .replace(/\s+/g, " ");
  }

  function uid() {

  function createStore(deps) {

    var hash = deps.hash;
    var core = deps.core;
    var cryptoLib = deps.crypto || (typeof crypto !== "undefined" ? crypto : null);

    var current = null;
    var listeners = [];

    var LOCK_MINUTES = 15;

    function subscribe(fn) {

      return function () {

          return l !== fn;
        });
      };
    }

    function publicAccount(account) {
      if (!account) return null;
      return {
        id: account.id,
        name: account.name,
        email: account.email,
        phone: account.phone,
        document: account.document,
        birthDate: account.birthDate,
        city: account.city,
        bio: account.bio,
        avatar: account.avatar,
        createdAt: account.createdAt,
        updatedAt: account.updatedAt,
        lastLoginAt: account.lastLoginAt,
        photoUpdatedAt: account.photoUpdatedAt

    }

    function findAccount(email) {
      var target = core.normalizeEmail(email);
      return state.accounts.find(function (a) {
        return a.email === target;
      });
    }

    async function persistAccounts() {
      await db.set(KEYS.accounts, state.accounts);
    }

    async function load() {
      var results = await Promise.all([db.get(KEYS.accounts, []), db.get(KEYS.session, null)]);
      state.accounts = results[0] || [];
      state.session = results[1] || null;
      current = null;

      if (state.session && state.session.accountId) {
        var account = state.accounts.find(function (a) {
          return a.id === state.session.accountId;
        });
        var valid = state.session.expiresAt && new Date(state.session.expiresAt).getTime() > Date.now();
        if (account && valid) current = account;
        else {
          state.session = null;
          await db.set(KEYS.session, null);
        }
      }
      emit();
      return state;
    }

    async function startSession(account) {
      var session = {
        token: hash.randomToken(),
        accountId: account.id,
        createdAt: now(),
        expiresAt: new Date(Date.now() + SESSION_HOURS * 3600 * 1000).toISOString()
      };
      state.session = session;
      current = account;
      await db.set(KEYS.session, session);
    }

    /* ------------------------------ CADASTRO ------------------------------ */

    async function signup(payload) {
      var emails = state.accounts.map(function (a) {
        return a.email;
      });
      var check = core.validateSignup(payload, emails);
      if (!check.valid) {
        var err = new Error("Confira os campos destacados.");
        err.fields = check.errors;
        throw err;
      }

      var passwordHash = await hash.hashPassword(payload.password);
      var account = {
        id: uid(),
        name: core.normalizeName(payload.name),
        email: core.normalizeEmail(payload.email),
        phone: payload.phone ? core.onlyDigits(payload.phone) : "",
        document: payload.document ? core.onlyDigits(payload.document) : "",
        birthDate: payload.birthDate || "",
        city: core.normalizeName(payload.city || ""),
        bio: "",
        avatar: "",
        passwordHash: passwordHash,
        failedAttempts: 0,
        lockedUntil: null,
        lastLoginAt: now(),
        createdAt: now(),
        updatedAt: now(),
        photoUpdatedAt: null
      };
      state.accounts = state.accounts.concat([account]);
      await persistAccounts();
      await startSession(account);
      emit();
      return publicAccount(account);
    }

    /* -------------------------------- LOGIN ------------------------------- */

    async function login(email, password) {
      var account = findAccount(email);
      if (!account) {
        var unknown = new Error("E-mail ou senha incorretos.");
        unknown.fields = { password: "E-mail ou senha incorretos." };
        throw unknown;
      }

      if (account.lockedUntil && new Date(account.lockedUntil).getTime() > Date.now()) {
        var minutes = Math.max(1, Math.ceil((new Date(account.lockedUntil).getTime() - Date.now()) / 60000));

          "Sua conta foi bloqueada por segurança. Tente novamente em " + minutes + " minuto(s)."

        locked.fields = { password: "Conta bloqueada temporariamente." };
        throw locked;

      var email = patch.email === undefined ? current.email : core.normalizeEmail(patch.email);
      if (!core.isValidEmail(email)) errors.email = "E-mail inválido.";

        var duplicated = state.accounts.some(function (a) {
          return a.id !== current.id && a.email === email;
        });
        if (duplicated) errors.email = "Este e-mail já pertence a outra conta.";
      }

      if (patch.document) {
        if (!core.isValidCPF(patch.document)) errors.document = "CPF inválido.";
      }
      if (patch.phone && !core.isValidPhone(patch.phone)) errors.phone = "Telefone incompleto.";

      if (Object.keys(errors).length) {
        var err = new Error("Confira os campos destacados.");
        err.fields = errors;
        throw err;
      }

      var updated = Object.assign({}, current, {
        name: name,
        email: email,
        phone: patch.phone === undefined ? current.phone : core.onlyDigits(patch.phone),
        document: patch.document === undefined ? current.document : core.onlyDigits(patch.document),
        birthDate: patch.birthDate === undefined ? current.birthDate : patch.birthDate,
        city: patch.city === undefined ? current.city : core.normalizeName(patch.city),
        bio: patch.bio === undefined ? current.bio : String(patch.bio).slice(0, 300),
        updatedAt: now()
      });

      state.accounts = state.accounts.map(function (a) {
        return a.id === updated.id ? updated : a;
      });
      current = updated;
      await persistAccounts();
      emit();
      return publicAccount(updated);
    }

    /** Salva a foto (data URL já redimensionada) do jeito mais seguro possível. */
    async function savePhoto(dataUrl) {
      if (!current) throw new Error("Sua sessão expirou. Entre novamente.");
      if (!dataUrl || !/^data:image\/(jpeg|png|webp);base64,/.test(dataUrl)) {
        throw new Error("Formato de imagem não aceito.");
      }
      if (dataUrl.length > 900 * 1024) throw new Error("Imagem muito grande. Tente outra foto.");

      var updated = Object.assign({}, current, {
        avatar: dataUrl,
        photoUpdatedAt: now(),
        updatedAt: now()
      });
      state.accounts = state.accounts.map(function (a) {
        return a.id === updated.id ? updated : a;
      });
      current = updated;
      await persistAccounts();

      // Confirma que realmente persistiu (IndexedDB + espelho).
      var stored = await db.get(KEYS.accounts, []);
      var saved = (stored || []).find(function (a) {
        return a.id === updated.id;
      });
      emit();
      return { saved: Boolean(saved && saved.avatar === dataUrl), account: publicAccount(updated) };
    }

    async function clearPhoto() {
      if (!current) throw new Error("Sua sessão expirou. Entre novamente.");
      var updated = Object.assign({}, current, { avatar: "", photoUpdatedAt: null, updatedAt: now() });
      state.accounts = state.accounts.map(function (a) {
        return a.id === updated.id ? updated : a;
      });
      current = updated;
      await persistAccounts();
      emit();
      return publicAccount(updated);
    }

    async function changePassword(currentPassword, newPassword, confirmPassword) {
      if (!current) throw new Error("Sua sessão expirou. Entre novamente.");
      var fields = {};
      var ok = await hash.verifyPassword(currentPassword, current.passwordHash);
      if (!ok) fields.currentPassword = "A senha atual está incorreta.";
      var error = core.validatePassword(newPassword);
      if (error) fields.newPassword = error;
      if (newPassword !== confirmPassword) fields.confirmPassword = "As senhas não conferem.";
      if (Object.keys(fields).length) {
        var err = new Error("Confira os campos destacados.");
        err.fields = fields;
        throw err;
      }
      var updated = Object.assign({}, current, {
        passwordHash: await hash.hashPassword(newPassword),
        updatedAt: now()
      });
      state.accounts = state.accounts.map(function (a) {
        return a.id === updated.id ? updated : a;
      });
      current = updated;
      await persistAccounts();
      emit();
      return true;
    }

    async function deleteAccount(password) {
      if (!current) throw new Error("Sua sessão expirou.");
      var ok = await hash.verifyPassword(password, current.passwordHash);
      if (!ok) {
        var err = new Error("Senha incorreta.");
        err.fields = { password: "Senha incorreta." };
        throw err;
      }
      state.accounts = state.accounts.filter(function (a) {
        return a.id !== current.id;
      });
      await persistAccounts();
      await logout();
      return true;
    }

    /* ------------------------------ CONSULTAS ----------------------------- */

    function currentAccount() {
      return publicAccount(current);
    }

    function isAuthenticated() {
      return Boolean(current);
    }

    function listEmails() {
      return state.accounts.map(function (a) {
        return a.email;
      });
    }

    function accountCount() {
      return state.accounts.length;
    }

    function storageEstimate() {
      try {
        var total = 0;
        for (var i = 0; i < localStorage.length; i++) {
          var key = localStorage.key(i);
          if (key && key.indexOf(PREFIX) === 0) total += (localStorage.getItem(key) || "").length + key.length;
        }
        if (total < 1024) return total + " B";
        if (total < 1024 * 1024) return (total / 1024).toFixed(1) + " KB";
        return (total / 1024 / 1024).toFixed(2) + " MB";
      } catch (err) {
        return "—";
      }
    }

    function hasSupport() {
      return Boolean(cryptoLib && cryptoLib.subtle);
    }

    return {
      load: load,
      subscribe: subscribe,
      getState: function () {
        return state;
      },
      currentAccount: currentAccount,
      isAuthenticated: isAuthenticated,
      signup: signup,
      login: login,
      logout: logout,
      updateProfile: updateProfile,
      savePhoto: savePhoto,
      removePhoto: clearPhoto,
      changePassword: changePassword,
      deleteAccount: deleteAccount,
      listEmails: listEmails,
      accountCount: accountCount,
      storageEstimate: storageEstimate,
      hasSupport: hasSupport,
      driver: function () {
        return db.driver();
      }
    };
  }

  return { createStore: createStore, createDB: createDB, KEYS: KEYS };
});

    pin: '<path d="M20 10.2c0 5.7-8 11.3-8 11.3s-8-5.6-8-11.3a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="2.6"/>',
    camera: '<path d="M22 18.5a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h3l1.6-2.5h6.8L17 7h3a2 2 0 0 1 2 2z"/><circle cx="12" cy="13.2" r="3.6"/>',
    database: '<ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.7 4 3 9 3s9-1.3 9-3V5"/><path d="M3 12c0 1.7 4 3 9 3s9-1.3 9-3"/>'
  };

  function icon(name, size) {
    var body = paths[name] || paths.info;
    var s = size || 18;
    return (
      '<svg viewBox="0 0 24 24" width="' + s + '" height="' + s + '" fill="none" stroke="currentColor" ' +
      'stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + body + "</svg>"
    );
  }

  return { icon: icon, paths: paths };
});

</script>
<script>
/*
 * Interface de conta: Login, Criar conta e Meu perfil.
 * Sem framework. Todo o estado vive no AccountStore (IndexedDB + localStorage).
 */
(function () {
  "use strict";

  var core = window.AccountCore;
  var hash = window.AccountHash;
  var lib = window.AccountStore;
  var Icons = window.AppIcons;

  var db = null;
  var store = null;
  var route = "login";
  var pendingPhoto = null;
  var photoState = { saved: false, at: null };
  var MAX_PHOTO_SIDE = 512;

  /* ============================== HELPERS DOM ============================== */

  function $(selector, scope) {
    return (scope || document).querySelector(selector);
  }
  function $$(selector, scope) {
    return Array.prototype.slice.call((scope || document).querySelectorAll(selector));
  }
  function esc(text) {
    return String(text === null || text === undefined ? "" : text)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function val(scope, name) {
    var node = scope ? scope.querySelector('[name="' + name + '"]') : null;
    return node ? node.value : "";
  }
  /** scrollIntoView seguro (ambientes sem a API, ex.: testes). */
  function reveal(node) {
    if (node && typeof node.scrollIntoView === "function") {
      node.scrollIntoView({ behavior: "smooth", block: "center" });
    }
  }

  function sleep(ms) {
    return new Promise(function (resolve) { setTimeout(resolve, ms); });
  }

  /* ================================ TOASTS ================================ */

  var TOAST_ICONS = {
    success: '<circle cx="12" cy="12" r="9"/><path d="m8.5 12.5 2.5 2.5 4.5-5"/>',
    error: '<circle cx="12" cy="12" r="9"/><path d="m15 9-6 6M9 9l6 6"/>',
    info: '<circle cx="12" cy="12" r="9"/><path d="M12 16v-5M12 8h.01"/>'
  };

  function toast(message, type, title) {
    var holder = $("#toasts");
    if (!holder) return;
    var kind = type || "success";
    var node = document.createElement("div");
    node.className = "toast toast-" + kind;
    node.innerHTML =
      '<span class="toast-icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" ' +
      'stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">' + (TOAST_ICONS[kind] || TOAST_ICONS.info) + "</svg></span>" +
      '<div class="toast-content"><strong>' + esc(title || (kind === "error" ? "Não foi possível" : "Tudo certo")) + "</strong>" +
      "<span>" + esc(message) + "</span></div>";
    holder.appendChild(node);
    setTimeout(function () {
      node.classList.add("out");
      setTimeout(function () { node.remove(); }, 260);
    }, kind === "error" ? 5200 : 3200);
  }

  /* ============================== VALIDAÇÃO UI ============================== */

  function setError(form, name, message) {
    var slot = form.querySelector('[data-error="' + name + '"]');
    var input = form.querySelector('[name="' + name + '"]');
    if (slot) {
      slot.textContent = message || "";
      slot.classList.toggle("show", Boolean(message));
    }
    if (input) {
      input.classList.toggle("invalid", Boolean(message));
      input.setAttribute("aria-invalid", message ? "true" : "false");
    }
  }

  function clearErrors(form) {
    $$("[data-error]", form).forEach(function (slot) {
      slot.textContent = "";
      slot.classList.remove("show");
    });
    $$(".invalid", form).forEach(function (input) {
      input.classList.remove("invalid");
      input.removeAttribute("aria-invalid");
    });
  }

  function showErrors(form, errors) {
    clearErrors(form);
    var names = Object.keys(errors || {});
    names.forEach(function (name) { setError(form, name, errors[name]); });
    if (names.length) {
      var first = form.querySelector('[name="' + names[0] + '"]');
      if (first) first.focus();
    }
    return names.length;
  }

  function setBusy(button, busy, label) {
    if (!button) return;
    if (busy) {
      button.dataset.label = button.innerHTML;
      button.disabled = true;
      button.innerHTML = '<span class="spinner"></span> ' + esc(label || "Aguarde...");
    } else {
      button.disabled = false;
      if (button.dataset.label) button.innerHTML = button.dataset.label;
    }
  }

  /* ============================== MÁSCARAS ============================== */

  function maskInput(input, formatter) {
    if (!input) return;
    input.addEventListener("input", function () {
      var before = input.value.length;
      var pos = input.selectionStart;
      input.value = formatter(input.value);
      var after = input.value.length;
      if (pos !== null) input.setSelectionRange(pos + (after - before), pos + (after - before));
    });
  }

  /* ============================== TEMA / CONTRASTE ============================== */

  function bootChrome() {
    var saved = null;
    try { saved = localStorage.getItem("conta:theme"); } catch (err) { saved = null; }
    var theme = saved || (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    applyTheme(theme);
  }

  function applyTheme(theme) {
    document.documentElement.setAttribute("data-theme", theme);
    try { localStorage.setItem("conta:theme", theme); } catch (err) { /* ignora */ }
    $$("[data-theme-toggle]").forEach(function (btn) {
      btn.innerHTML = Icons.icon(theme === "dark" ? "sun" : "moon", 18);
      btn.setAttribute("aria-label", theme === "dark" ? "Ativar tema claro" : "Ativar tema escuro");
    });
  }

  function toggleTheme() {
    var next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    applyTheme(next);
  }

  /* ================================ AVATAR ================================ */

  function avatarMarkup(account, size) {
    var cls = "avatar avatar-" + (size || "md");
    if (account && account.avatar) {
      return '<span class="' + cls + '"><img src="' + account.avatar + '" alt="Foto de ' + esc(account.name) + '"></span>';
    }
    return '<span class="' + cls + '">' + esc(core.initials(account && account.name)) + "</span>";
  }

  /* ================================ FOTO ================================ */

  function readPhoto(file) {
    return new Promise(function (resolve, reject) {
      if (!file) return reject(new Error("Nenhum arquivo selecionado."));
      if (!/^image\/(jpeg|png|webp|heic|heif)$/.test(file.type)) {
        return reject(new Error("Escolha uma imagem JPG, PNG ou WEBP."));
      }
      if (file.size > 15 * 1024 * 1024) return reject(new Error("A imagem precisa ter menos de 15 MB."));

      var reader = new FileReader();
      reader.onerror = function () { reject(new Error("Não conseguimos ler o arquivo.")); };
      reader.onload = function () {
        var img = new Image();
        img.onerror = function () { reject(new Error("O arquivo parece não ser uma imagem válida.")); };
        img.onload = function () {
          var scale = Math.min(1, MAX_PHOTO_SIDE / Math.max(img.width, img.height));
          var w = Math.max(1, Math.round(img.width * scale));
          var h = Math.max(1, Math.round(img.height * scale));
          var canvas = document.createElement("canvas");
          canvas.width = w;
          canvas.height = h;
          var ctx = canvas.getContext("2d");
          ctx.imageSmoothingEnabled = true;
          ctx.imageSmoothingQuality = "high";
          ctx.fillStyle = "#ffffff";
          ctx.fillRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL("image/jpeg", 0.88));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  async function handlePhotoFile(file) {
    var zone = $("#photo-drop");
    try {
      if (zone) zone.classList.add("busy");
      var dataUrl = await readPhoto(file);
      pendingPhoto = dataUrl;
      $("#photo-preview").innerHTML = '<span class="avatar avatar-xl"><img src="' + dataUrl + '" alt="Prévia da foto"></span>';
      $("#photo-actions").classList.remove("hidden");
      $("#photo-hint").textContent = "Prévia carregada — clique em “Salvar foto” para gravar no seu perfil.";
      $("#photo-save").focus();
    } catch (err) {
      toast(err.message, "error", "Foto não aceita");
    } finally {
      if (zone) zone.classList.remove("busy");
    }
  }

  /* ================================ ROTAS ================================ */

  function routeFromHash() {
    var h = (window.location.hash || "").replace("#", "");
    if (store.isAuthenticated()) {
      if (h === "cadastro" || h === "login") return "perfil";
      return "perfil";
    }
    return h === "cadastro" ? "cadastro" : "login";
  }

  function go(next) {
    window.location.hash = next;
  }

  function render() {
    route = routeFromHash();
    var root = $("#app");
    if (store.isAuthenticated()) {
      root.innerHTML = profileView(store.currentAccount());
      bindProfile();
    } else {
      root.innerHTML = route === "cadastro" ? signupView() : loginView();
      route === "cadastro" ? bindSignup() : bindLogin();
    }
  }

  function brandPanel() {
    return (
      '<aside class="brand">' +
        '<div class="brand-top">' +
          '<div class="brand-logo"><span class="brand-mark">P</span><span>Palco</span></div>' +
          '<button class="icon-btn brand-theme" data-theme-toggle type="button"></button>' +
        "</div>" +
        '<div class="brand-center">' +
          '<h1>Sua conta,<br><em>no seu tempo.</em></h1>' +
          '<p>Cadastro rápido, login seguro e sua foto guardada. Volte quando quiser — a sessão continua salva neste dispositivo.</p>' +
          '<ul class="brand-list">' +
            "<li>" + Icons.icon("shield", 18) + "<span><strong>Senha protegida</strong> com PBKDF2-SHA256, 210 mil iterações</span></li>" +
            "<li>" + Icons.icon("camera", 18) + "<span><strong>Foto de perfil</strong> redimensionada e salva</span></li>" +
            "<li>" + Icons.icon("database", 18) + "<span><strong>Dados no aparelho</strong> — nada sai para servidores</span></li>" +
          "</ul>" +
        "</div>" +
        '<div class="brand-foot">Ao criar a conta, seus dados ficam salvos apenas neste navegador.</div>' +
      "</aside>"
    );
  }

  /* ================================ LOGIN ================================ */

  function loginView() {
    return (
      '<div class="shell">' + brandPanel() +
        '<main class="panel">' +
          '<div class="card">' +
            '<div class="card-head">' +
              "<h2>Entrar na sua conta</h2>" +
              "<p>Informe o e-mail e a senha que você cadastrou.</p>" +
            "</div>" +
            '<form class="form" id="form-login" novalidate autocomplete="on">' +
              '<div class="field">' +
                '<label for="login-email">E-mail</label>' +
                '<div class="control">' + Icons.icon("mail", 17) +
                  '<input id="login-email" name="email" type="email" autocomplete="username" placeholder="voce@email.com" required>' +
                "</div>" +
                '<span class="error-slot" data-error="email"></span>' +
              "</div>" +
              '<div class="field">' +
                '<label for="login-password">Senha</label>' +
                '<div class="control">' + Icons.icon("lock", 17) +
                  '<input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="Sua senha" required>' +
                  '<button class="reveal" type="button" data-reveal="login-password" aria-label="Mostrar senha">' + Icons.icon("eye", 17) + "</button>" +
                "</div>" +
                '<span class="error-slot" data-error="password"></span>' +
              "</div>" +
              '<button class="btn btn-primary btn-block" type="submit" id="login-submit">Entrar</button>' +
            "</form>" +
            '<div class="card-foot">Ainda não tem conta? <a href="#cadastro">Criar conta grátis</a></div>' +
            (store.accountCount() === 0
              ? '<div class="notice">' + Icons.icon("info", 17) + "<span>Nenhuma conta neste navegador ainda. <a href=\"#cadastro\">Crie a primeira</a> — leva 30 segundos.</span></div>"
              : "") +
          "</div>" +
        "</main>" +
      "</div>"
    );
  }

  function bindLogin() {
    var form = $("#form-login");
    if (!form) return;
    var reveal = $("[data-reveal]", form);
    if (reveal) reveal.addEventListener("click", function () {
      var input = $("#login-password");
      var show = input.type === "password";
      input.type = show ? "text" : "password";
      reveal.innerHTML = Icons.icon(show ? "eyeOff" : "eye", 17);
      reveal.setAttribute("aria-label", show ? "Ocultar senha" : "Mostrar senha");
    });

    form.addEventListener("submit", async function (event) {
      event.preventDefault();
      clearErrors(form);
      var payload = { email: val(form, "email"), password: val(form, "password") };
      var check = core.validateLogin(payload);
      if (!check.valid) return showErrors(form, check.errors);

      var button = $("#login-submit");
      setBusy(button, true, "Entrando...");
      try {
        var account = await store.login(payload.email, payload.password);
        toast("Que bom te ver, " + account.name.split(" ")[0] + "!", "success", "Login realizado");
        go("perfil");
        render();
        setTimeout(function () { window.scrollTo({ top: 0, behavior: "smooth" }); }, 60);
      } catch (err) {
        showErrors(form, err.fields || {});
        if (!err.fields) toast(err.message, "error");
      } finally {
        setBusy(button, false);
      }
    });
  }

  /* ================================ CADASTRO ================================ */

  function signupView() {
    return (
      '<div class="shell">' + brandPanel() +
        '<main class="panel">' +
          '<div class="card">' +
            '<div class="card-head">' +
              "<h2>Criar sua conta</h2>" +
              "<p>Leva menos de um minuto. A foto você adiciona depois, no perfil.</p>" +
            "</div>" +
            '<form class="form" id="form-signup" novalidate autocomplete="on">' +
              '<div class="field">' +
                '<label for="su-name">Nome completo</label>' +
                '<div class="control">' + Icons.icon("user", 17) +
                  '<input id="su-name" name="name" autocomplete="name" placeholder="Ana Beatriz Lopes" required>' +
                "</div>" +
                '<span class="error-slot" data-error="name"></span>' +
              "</div>" +
              '<div class="field">' +
                '<label for="su-email">E-mail</label>' +
                '<div class="control">' + Icons.icon("mail", 17) +
                  '<input id="su-email" name="email" type="email" autocomplete="email" placeholder="voce@email.com" required>' +
                  '<span class="field-check" data-email-check></span>' +
                "</div>" +
                '<span class="error-slot" data-error="email"></span>' +
              "</div>" +
              '<div class="grid-2">' +
                '<div class="field">' +
                  '<label for="su-phone">Telefone <span class="opt">(opcional)</span></label>' +
                  '<div class="control">' + Icons.icon("phone", 17) +
                    '<input id="su-phone" name="phone" inputmode="tel" autocomplete="tel" placeholder="(31) 99999-8888">' +
                  "</div>" +
                  '<span class="error-slot" data-error="phone"></span>' +
                "</div>" +
                '<div class="field">' +
                  '<label for="su-document">CPF <span class="opt">(opcional)</span></label>' +
                  '<div class="control">' + Icons.icon("id", 17) +
                    '<input id="su-document" name="document" inputmode="numeric" placeholder="000.000.000-00">' +
                  "</div>" +
                  '<span class="error-slot" data-error="document"></span>' +
                "</div>" +
              "</div>" +
              '<div class="field">' +
                '<label for="su-password">Senha</label>' +
                '<div class="control">' + Icons.icon("lock", 17) +
                  '<input id="su-password" name="password" type="password" autocomplete="new-password" placeholder="Mínimo 8 caracteres com número" required>' +
                  '<button class="reveal" type="button" data-reveal="su-password" aria-label="Mostrar senha">' + Icons.icon("eye", 17) + "</button>" +
                "</div>" +
                '<div class="strength" data-strength><span></span><span></span><span></span><span></span></div>' +
                '<span class="strength-label" data-strength-label></span>' +
                '<span class="error-slot" data-error="password"></span>' +
              "</div>" +
              '<div class="field">' +
                '<label for="su-password-confirm">Confirmar senha</label>' +
                '<div class="control">' + Icons.icon("lock", 17) +
                  '<input id="su-password-confirm" name="passwordConfirm" type="password" autocomplete="new-password" placeholder="Repita a senha" required>' +
                  '<span class="field-check" data-match-check></span>' +
                "</div>" +
                '<span class="error-slot" data-error="passwordConfirm"></span>' +
              "</div>" +
              '<button class="btn btn-primary btn-block" type="submit" id="signup-submit">Criar conta</button>' +
            "</form>" +
            '<div class="card-foot">Já tem conta? <a href="#login">Entrar</a></div>' +
          "</div>" +
        "</main>" +
      "</div>"
    );
  }

  function bindSignup() {
    var form = $("#form-signup");
    if (!form) return;

    maskInput($("#su-phone"), core.formatPhone);
    maskInput($("#su-document"), core.formatCPF);

    $$("[data-reveal]", form).forEach(function (button) {
      button.addEventListener("click", function () {
        var input = $("#" + button.dataset.reveal);
        var show = input.type === "password";
        input.type = show ? "text" : "password";
        button.innerHTML = Icons.icon(show ? "eyeOff" : "eye", 17);
      });
    });

    var email = $("#su-email");
    email.addEventListener("input", function () {
      var status = core.emailStatus(email.value, store.listEmails());
      var slot = $("[data-email-check]");
      slot.className = "field-check " + (status.state === "ok" ? "ok" : status.state === "taken" ? "bad" : "");
      slot.innerHTML = status.state === "ok" ? Icons.icon("check", 15) : status.state === "taken" ? Icons.icon("xCircle", 15) : "";
      setError(form, "email", status.state === "taken" ? status.message : "");
    });

    var password = $("#su-password");
    password.addEventListener("input", function () {
      var score = core.passwordScore(password.value);
      var bar = $("[data-strength]");
      bar.dataset.score = String(score);
      $("[data-strength-label]").textContent = password.value ? core.passwordLabel(score) : "";
      if (val(form, "passwordConfirm")) checkMatch();
    });

    function checkMatch() {
      var slot = $("[data-match-check]");
      var same = val(form, "passwordConfirm") && val(form, "password") === val(form, "passwordConfirm");
      slot.className = "field-check " + (same ? "ok" : "");
      slot.innerHTML = same ? Icons.icon("check", 15) : "";
      if (same) setError(form, "passwordConfirm", "");
    }
    $("#su-password-confirm").addEventListener("input", checkMatch);

    form.addEventListener("submit", async function (event) {
      event.preventDefault();
      clearErrors(form);
      var payload = {
        name: val(form, "name"),
        email: val(form, "email"),
        phone: val(form, "phone"),
        document: val(form, "document"),
        password: val(form, "password"),
        passwordConfirm: val(form, "passwordConfirm")
      };
      var check = core.validateSignup(payload, store.listEmails());
      if (!check.valid) return showErrors(form, check.errors);

      var button = $("#signup-submit");
      setBusy(button, true, "Criando sua conta...");
      try {
        var account = await store.signup(payload);
        toast("Conta criada com sucesso. Bem-vinda, " + account.name.split(" ")[0] + "!", "success");
        go("perfil");
        render();
      } catch (err) {
        showErrors(form, err.fields || {});
        if (!err.fields) toast(err.message, "error");
      } finally {
        setBusy(button, false);
      }
    });
  }

  /* ================================ PERFIL ================================ */

  function profileView(account) {
    var age = core.ageFromBirthDate(account.birthDate);
    var memberSince = core.formatDateBR(account.createdAt);
    var lastLogin = account.lastLoginAt ? core.relativeTime(account.lastLoginAt) : "agora";
    var driverLabel = store.driver() === "indexeddb" ? "IndexedDB" : store.driver() === "localstorage" ? "Armazenamento local" : "Memória (temporário)";

    return (
      '<div class="app">' +
        '<header class="topbar">' +
          '<div class="topbar-brand"><span class="brand-mark sm">P</span><span>Palco</span></div>' +
          '<div class="topbar-right">' +
            '<span class="save-chip" id="save-chip">' + Icons.icon("check", 14) + "<span>Tudo salvo</span></span>" +
            '<button class="icon-btn" data-theme-toggle type="button"></button>' +
            '<div class="account-chip">' + avatarMarkup(account, "sm") +
              '<div class="account-chip-text"><strong>' + esc(account.name.split(" ")[0]) + "</strong><span>" + esc(account.email) + "</span></div>" +
            "</div>" +
            '<button class="btn btn-ghost btn-sm" id="logout-btn" type="button">' + Icons.icon("logout", 16) + "<span>Sair</span></button>" +
          "</div>" +
        "</header>" +

        '<main class="view">' +
          '<section class="hero">' +
            '<div class="hero-left">' +
              '<div class="photo-block">' +
                '<div id="photo-preview">' + avatarMarkup(account, "xl") + "</div>" +
                '<button class="photo-badge" id="photo-pick" type="button" title="Trocar foto">' + Icons.icon("camera", 16) + "</button>" +
                '<input type="file" id="photo-file" accept="image/jpeg,image/png,image/webp" hidden>' +
              "</div>" +
              "<div class=\"hero-info\">" +
                "<h1>" + esc(account.name) + "</h1>" +
                '<p class="hero-email">' + esc(account.email) + "</p>" +
                '<div class="chips">' +
                  '<span class="chip">' + Icons.icon("calendar", 13) + " Conta criada em " + esc(memberSince) + "</span>" +
                  (age !== null ? '<span class="chip">' + Icons.icon("user", 13) + " " + age + " anos</span>" : "") +
                  (account.city ? '<span class="chip">' + Icons.icon("pin", 13) + " " + esc(account.city) + "</span>" : "") +
                "</div>" +
              "</div>" +
            "</div>" +
            '<div class="hero-actions">' +
              '<button class="btn btn-primary" id="photo-pick-2" type="button">' + Icons.icon("camera", 16) + " Trocar foto</button>" +
              '<button class="btn btn-outline" id="photo-remove" type="button"' + (account.avatar ? "" : " disabled") + ">Remover</button>" +
            "</div>" +
          "</section>" +

          '<div class="layout">' +
            '<section class="col-main">' +
              /* ----- foto ----- */
              '<article class="card">' +
                '<div class="card-title">' + Icons.icon("camera", 17) + "<h2>Foto do perfil</h2>" +
                  (account.photoUpdatedAt ? '<span class="badge-soft">atualizada ' + esc(core.relativeTime(account.photoUpdatedAt)) + "</span>" : "") +
                "</div>" +
                '<div class="card-body">' +
                  '<div class="dropzone" id="photo-drop" tabindex="0" role="button" aria-label="Enviar foto">' +
                    Icons.icon("upload", 22) +
                    "<strong>Arraste uma foto ou clique para escolher</strong>" +
                    '<span>JPG, PNG ou WEBP · até 15 MB · ajustamos para 512 px automaticamente</span>' +
                    '<span class="photo-hint" id="photo-hint">Sua foto fica salva neste disposivo e aparece ao entrar.</span>' +
                  "</div>" +
                  '<div class="photo-actions hidden" id="photo-actions">' +
                    '<button class="btn btn-primary" id="photo-save" type="button">' + Icons.icon("check", 16) + " Salvar foto</button>" +
                    '<button class="btn btn-ghost" id="photo-cancel" type="button">Cancelar</button>' +
                  "</div>" +
                "</div>" +
              "</article>" +

              /* ----- dados ----- */
              '<article class="card">' +
                '<div class="card-title">' + Icons.icon("user", 17) + "<h2>Seus dados</h2></div>" +
                '<div class="card-body">' +
                  '<form class="form" id="form-profile" novalidate>' +
                    '<div class="grid-2">' +
                      field("Nome completo", "name", account.name, "text", "user") +
                      field("E-mail", "email", account.email, "email", "mail") +
                    "</div>" +
                    '<div class="grid-2">' +
                      field("Telefone", "phone", account.phone ? core.formatPhone(account.phone) : "", "tel", "phone") +
                      field("CPF", "document", account.document ? core.formatCPF(account.document) : "", "text", "id") +
                    "</div>" +
                    '<div class="grid-2">' +
                      field("Data de nascimento", "birthDate", account.birthDate || "", "date", "calendar") +
                      field("Cidade", "city", account.city || "", "text", "pin") +
                    "</div>" +
                    '<div class="field">' +
                      '<label for="pf-bio">Sobre você <span class="opt">(opcional)</span></label>' +
                      '<textarea id="pf-bio" name="bio" maxlength="300" placeholder="Uma frase sobre você...">' + esc(account.bio || "") + "</textarea>" +
                      '<span class="counter" data-bio-counter>' + (account.bio || "").length + "/300</span>" +
                    "</div>" +
                    '<div class="form-actions">' +
                      '<button class="btn btn-primary" type="submit" id="profile-submit">Salvar alterações</button>' +
                      '<button class="btn btn-ghost" type="reset" id="profile-reset">Desfazer</button>' +
                    "</div>" +
                  "</form>" +
                "</div>" +
              "</article>" +
            "</section>" +

            '<aside class="col-side">' +
              /* ----- sessão ----- */
              '<article class="card">' +
                '<div class="card-title">' + Icons.icon("shield", 17) + "<h2>Sessão e segurança</h2></div>" +
                '<div class="card-body stack">' +
                  '<div class="kv"><span>Último acesso</span><strong>' + esc(lastLogin) + "</strong></div>" +
                  '<div class="kv"><span>Sessão válida por</span><strong>24 horas</strong></div>' +
                  '<div class="kv"><span>Onde os dados ficam</span><strong>' + esc(driverLabel) + "</strong></div>" +
                  '<div class="kv"><span>Espaço usado</span><strong>' + esc(store.storageEstimate()) + "</strong></div>" +
                  '<button class="btn btn-outline btn-block" id="open-password" type="button">' + Icons.icon("lock", 16) + " Alterar senha</button>" +
                  '<button class="btn btn-ghost btn-block" id="logout-btn-2" type="button">' + Icons.icon("logout", 16) + " Sair da conta</button>" +
                "</div>" +
              "</article>" +

              /* ----- senha ----- */
              '<article class="card hidden" id="password-card">' +
                '<div class="card-title">' + Icons.icon("lock", 17) + "<h2>Alterar senha</h2></div>" +
                '<div class="card-body">' +
                  '<form class="form" id="form-password" novalidate>' +
                    field("Senha atual", "currentPassword", "", "password", "lock") +
                    '<div class="field">' +
                      '<label for="np">Nova senha</label>' +
                      '<div class="control">' + Icons.icon("lock", 17) +
                        '<input id="np" name="newPassword" type="password" autocomplete="new-password" placeholder="Mínimo 8 caracteres com número">' +
                      "</div>" +
                      '<div class="strength" data-strength><span></span><span></span><span></span><span></span></div>' +
                      '<span class="error-slot" data-error="newPassword"></span>' +
                    "</div>" +
                    field("Confirmar nova senha", "confirmPassword", "", "password", "lock") +
                    '<div class="form-actions">' +
                      '<button class="btn btn-primary" type="submit">Salvar nova senha</button>' +
                      '<button class="btn btn-ghost" type="button" id="close-password">Cancelar</button>' +
                    "</div>" +
                  "</form>" +
                "</div>" +
              "</article>" +

              /* ----- conta ----- */
              '<article class="card">' +
                '<div class="card-title">' + Icons.icon("info", 17) + "<h2>Sobre sua conta</h2></div>" +
                '<div class="card-body stack">' +
                  '<div class="kv"><span>Contas neste navegador</span><strong>' + store.accountCount() + "</strong></div>" +
                  '<div class="kv"><span>Criptografia</span><strong>' + (store.hasSupport() ? "Web Crypto" : "Compatível") + "</strong></div>" +
                  '<p class="tiny muted">Seus dados não saem deste aparelho. Limpar os dados do navegador apaga a conta.</p>' +
                  '<button class="btn btn-danger-ghost btn-block" id="delete-account" type="button">' + Icons.icon("trash", 15) + " Excluir minha conta</button>" +
                "</div>" +
              "</article>" +
            "</aside>" +
          "</div>" +
        "</main>" +
      "</div>"
    );
  }

  function field(label, name, value, type, icon) {
    return (
      '<div class="field">' +
        '<label for="pf-' + name + '">' + esc(label) + "</label>" +
        '<div class="control">' + Icons.icon(icon || "user", 17) +
          '<input id="pf-' + name + '" name="' + name + '" type="' + (type || "text") + '" value="' + esc(value || "") + '">' +
        "</div>" +
        '<span class="error-slot" data-error="' + name + '"></span>' +
      "</div>"
    );
  }

  function bindProfile() {
    var account = store.currentAccount();
    var form = $("#form-profile");
    var drop = $("#photo-drop");
    var fileInput = $("#photo-file");

    function openPicker() { fileInput.click(); }
    $("#photo-pick").addEventListener("click", openPicker);
    $("#photo-pick-2").addEventListener("click", openPicker);
    fileInput.addEventListener("change", function () {
      if (fileInput.files && fileInput.files[0]) handlePhotoFile(fileInput.files[0]);
      fileInput.value = "";
    });

    drop.addEventListener("click", openPicker);
    drop.addEventListener("keydown", function (event) {
      if (event.key === "Enter" || event.key === " ") { event.preventDefault(); openPicker(); }
    });
    ["dragenter", "dragover"].forEach(function (name) {
      drop.addEventListener(name, function (event) { event.preventDefault(); drop.classList.add("drag"); });
    });
    ["dragleave", "drop"].forEach(function (name) {
      drop.addEventListener(name, function (event) { event.preventDefault(); drop.classList.remove("drag"); });
    });
    drop.addEventListener("drop", function (event) {
      var file = event.dataTransfer && event.dataTransfer.files && event.dataTransfer.files[0];
      if (file) handlePhotoFile(file);
    });

    $("#photo-save").addEventListener("click", async function () {
      if (!pendingPhoto) return;
      var button = $("#photo-save");
      setBusy(button, true, "Salvando...");
      try {
        var result = await store.savePhoto(pendingPhoto);
        if (!result.saved) throw new Error("Não conseguimos confirmar a gravação. Tente novamente.");
        pendingPhoto = null;
        toast("Sua foto foi salva e vai aparecer quando você voltar.", "success", "Foto atualizada");
        render();
      } catch (err) {
        toast(err.message, "error", "Erro ao salvar a foto");
        setBusy(button, false);
      }
    });

    $("#photo-cancel").addEventListener("click", function () {
      pendingPhoto = null;
      $("#photo-preview").innerHTML = avatarMarkup(store.currentAccount(), "xl");
      $("#photo-actions").classList.add("hidden");
      $("#photo-hint").textContent = "Sua foto fica salva neste disposivo e aparece ao entrar.";
    });

    $("#photo-remove").addEventListener("click", async function () {
      if (!store.currentAccount().avatar) return;
      await store.clearPhoto();
      toast("Foto removida.", "success");
      render();
    });

    // Máscaras e contador
    maskInput($("#pf-phone"), core.formatPhone);
    maskInput($("#pf-document"), core.formatCPF);
    var bio = $("#pf-bio");
    bio.addEventListener("input", function () {
      var counter = $("[data-bio-counter]");
      if (counter) counter.textContent = bio.value.length + "/300";
    });

    form.addEventListener("submit", async function (event) {
      event.preventDefault();
      clearErrors(form);
      var button = $("#profile-submit");
      setBusy(button, true, "Salvando...");
      try {
        await store.updateProfile({
          name: val(form, "name"),
          email: val(form, "email"),
          phone: val(form, "phone"),
          document: val(form, "document"),
          birthDate: val(form, "birthDate"),
          city: val(form, "city"),
          bio: val(form, "bio")
        });
        flashSaved();
        toast("Dados atualizados.", "success");
        render();
      } catch (err) {
        showErrors(form, err.fields || {});
        if (!err.fields) toast(err.message, "error");
      } finally {
        setBusy(button, false);
      }
    });

    $("#profile-reset").addEventListener("click", function () {
      setTimeout(function () { render(); }, 10);
    });

    // Senha
    var passwordCard = $("#password-card");
    $("#open-password").addEventListener("click", function () {
      passwordCard.classList.remove("hidden");
      reveal(passwordCard);
      $("#form-password [name='currentPassword']").focus();
    });
    $("#close-password").addEventListener("click", function () { passwordCard.classList.add("hidden"); });

    var newPassword = $("#np");
    newPassword.addEventListener("input", function () {
      var bar = passwordCard.querySelector("[data-strength]");
      bar.dataset.score = String(core.passwordScore(newPassword.value));
    });

    $("#form-password").addEventListener("submit", async function (event) {
      event.preventDefault();
      var pwdForm = event.target;
      clearErrors(pwdForm);
      try {
        await store.changePassword(
          val(pwdForm, "currentPassword"),
          val(pwdForm, "newPassword"),
          val(pwdForm, "confirmPassword")
        );
        pwdForm.reset();
        passwordCard.classList.add("hidden");
        toast("Sua nova senha já está valendo.", "success", "Senha alterada");
      } catch (err) {
        showErrors(pwdForm, err.fields || {});
        if (!err.fields) toast(err.message, "error");
      }
    });

    // Sair
    ["#logout-btn", "#logout-btn-2"].forEach(function (selector) {
      var btn = $(selector);
      if (btn) btn.addEventListener("click", doLogout);
    });

    // Excluir conta
    $("#delete-account").addEventListener("click", async function () {
      var passwordCardNode = passwordCard;
      passwordCardNode.classList.remove("hidden");
      reveal(passwordCardNode);
      var confirmInput = pwdFormDelete();
      if (!confirmInput) return;
    });

    function pwdFormDelete() {
      if ($("#delete-confirm")) return $("#delete-confirm");
      var body = passwordCard.querySelector(".card-body");
      var box = document.createElement("div");
      box.className = "danger-box";
      box.innerHTML =
        "<p><strong>Excluir a conta apaga seus dados deste navegador.</strong> Não há como desfazer.</p>" +
        '<div class="control">' + Icons.icon("lock", 17) +
        '<input id="delete-confirm" type="password" placeholder="Digite sua senha para confirmar">' +
        "</div>" +
        '<span class="error-slot" data-error="password"></span>' +
        '<div class="form-actions"><button class="btn btn-danger" type="button" id="delete-go">Excluir definitivamente</button>' +
        '<button class="btn btn-ghost" type="button" id="delete-cancel">Cancelar</button></div>';
      body.appendChild(box);
      $("#delete-cancel").addEventListener("click", function () { box.remove(); });
      $("#delete-go").addEventListener("click", async function () {
        try {
          await store.deleteAccount($("#delete-confirm").value);
          toast("Conta excluída deste navegador.", "success");
          go("login");
          render();
        } catch (err) {
          showErrors(box, err.fields || {});
          if (!err.fields) toast(err.message, "error");
        }
      });
      return $("#delete-confirm");
    }

    // Chip "tudo salvo" reflete a última gravação
    var unsub = store.subscribe(function () {
      if (photoState.saved) flashSaved();
    });
    void unsub;
    void account;
  }

  var saveTimer = null;
  function flashSaved() {
    var chip = $("#save-chip");
    if (!chip) return;
    chip.classList.add("pulse");
    chip.innerHTML = Icons.icon("check", 14) + "<span>Salvo agora</span>";
    photoState.saved = true;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      if (!chip) return;
      chip.classList.remove("pulse");
      chip.innerHTML = Icons.icon("check", 14) + "<span>Tudo salvo</span>";
    }, 2600);
  }

  async function doLogout() {
    await store.logout();
    pendingPhoto = null;
    toast("Você saiu. Seus dados continuam salvos.", "success", "Até logo");
    go("login");
    render();
  }

  /* ================================ BOOT ================================ */

  async function boot() {
    bootChrome();
    db = lib.createDB();
    await db.init();
    store = lib.createStore({ db: db, hash: hash, core: core, crypto: window.crypto });

    try {
      await store.load();
    } catch (err) {
      toast("Não conseguimos acessar o armazenamento do navegador.", "error");
    }

    window.addEventListener("hashchange", render);
    document.addEventListener("click", function (event) {
      var toggle = event.target.closest ? event.target.closest("[data-theme-toggle]") : null;
      if (toggle) { toggleTheme(); return; }
      var link = event.target.closest ? event.target.closest('a[href^="#"]') : null;
      if (link) {
        event.preventDefault();
        go(link.getAttribute("href").slice(1));
      }
    });

    render();
    document.body.removeAttribute("data-booting");

    // Garante que a interface reflita mudanças de outra aba
    window.addEventListener("storage", async function (event) {
      if (event.key && event.key.indexOf("conta:") === 0) {
        await store.load();
        render();
      }
    });
    void sleep;
  }

  window.App = {
    boot: boot,
    render: render,
    store: function () { return store; },
    go: go
  };

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();

</script>
</body>
</html>
