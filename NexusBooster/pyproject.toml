[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-booster"
version = "1.2.0"
description = "Nexus Booster — Otimizador profissional de desempenho para Windows e jogos"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nexus Booster" }]
keywords = ["otimizador", "windows", "games", "desempenho", "fps", "booster"]
dependencies = [
    "PySide6>=6.6,<7",
    "psutil>=5.9",
]

[project.optional-dependencies]
windows = [
    "wmi>=1.5.1 ; sys_platform == 'win32'",
    "pywin32>=306 ; sys_platform == 'win32'",
    "nvidia-ml-py>=12.535 ; sys_platform == 'win32'",
]
dev = ["pyinstaller>=6.0", "pillow>=10.0", "numpy>=1.24"]

[project.scripts]
nexus-booster = "nexus.app:run"

[tool.setuptools.packages.find]
include = ["nexus*"]
