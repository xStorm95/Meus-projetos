/* ============================================================
   PALCO — ERP de moda · folha de estilo única
   Sem dependências externas: funciona offline e em file://
   ============================================================ */

:root {
  --bg: #faf8f5;
  --bg-elevated: #ffffff;
  --bg-muted: #f2ede6;
  --bg-sidebar: #14131a;
  --border: #e7e0d5;
  --border-strong: #d6ccbc;
  --text: #1b1a1f;
  --text-soft: #6b6660;
  --text-faint: #9b948b;
  --accent: #b08d3f;
  --accent-soft: #f4ecdb;
  --accent-strong: #8a6a24;
  --success: #1f7a4d;
  --success-soft: #e3f3ea;
  --danger: #b3261e;
  --danger-soft: #fbe9e7;
  --warning: #a5651a;
  --warning-soft: #fdf0dc;
  --info: #2a5b8f;
  --info-soft: #e6eff8;
  --shadow-sm: 0 1px 2px rgba(24, 20, 14, 0.06);
  --shadow: 0 8px 24px -12px rgba(24, 20, 14, 0.24), 0 2px 6px rgba(24, 20, 14, 0.04);
  --shadow-lg: 0 24px 60px -24px rgba(24, 20, 14, 0.4);
  --radius: 14px;
  --radius-sm: 10px;
  --radius-lg: 22px;
  --font-sans: "Passarela Sans", "Inter", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --font-display: "Passarela Display", "Cormorant Garamond", "Iowan Old Style", Georgia, "Times New Roman", serif;
}

html[data-accent="rose"] { --accent: #c07f86; --accent-soft: #fbeef0; --accent-strong: #a2626a; }
html[data-accent="emerald"] { --accent: #2f7a5f; --accent-soft: #e6f2ec; --accent-strong: #23604a; }
html[data-accent="navy"] { --accent: #2c4a7c; --accent-soft: #e8eef8; --accent-strong: #20375c; }
html[data-accent="indigo"] { --accent: #4f4bb0; --accent-soft: #eae9fa; --accent-strong: #3b3889; }
html[data-accent="graphite"] { --accent: #4a4a52; --accent-soft: #ececed; --accent-strong: #34343b; }

html[data-theme="dark"] {
  --bg: #121116;
  --bg-elevated: #1a1920;
  --bg-muted: #232229;
  --bg-sidebar: #0d0c11;
  --border: #2c2b33;
  --border-strong: #3a3943;
  --text: #f3efe8;
  --text-soft: #a9a29a;
  --text-faint: #736d67;
  --success-soft: #17352a;
  --danger-soft: #3a1c1a;
  --warning-soft: #3a2a13;
  --info-soft: #17293c;
  --shadow: 0 8px 24px -12px rgba(0, 0, 0, 0.7);
  --shadow-lg: 0 24px 60px -24px rgba(0, 0, 0, 0.8);
}

* { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  transition: background 0.25s ease, color 0.25s ease;
}

h1, h2, h3, h4 { margin: 0; font-weight: 600; letter-spacing: -0.01em; }
h1 { font-family: var(--font-display); font-size: 30px; font-weight: 600; letter-spacing: -0.02em; }
h2 { font-size: 17px; }
h3 { font-size: 14px; }
p { margin: 0; }
a { color: var(--accent-strong); text-decoration: none; }
button { font-family: inherit; font-size: inherit; cursor: pointer; }
input, select, textarea { font-family: inherit; font-size: inherit; }
::selection { background: var(--accent); color: #fff; }

.hidden { display: none !important; }
.muted { color: var(--text-soft); }
.faint { color: var(--text-faint); }
.tiny { font-size: 11px; }
.small { font-size: 12px; }
.bold { font-weight: 600; }
.mono { font-variant-numeric: tabular-nums; }
.center { text-align: center; }
.right { text-align: right; }
.nowrap { white-space: nowrap; }
.row { display: flex; align-items: center; gap: 10px; }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.col { display: flex; flex-direction: column; gap: 10px; }
.wrap { flex-wrap: wrap; }
.grow { flex: 1; }
.stack { display: grid; gap: 14px; }
.gap-4 { gap: 4px; } .gap-8 { gap: 8px; } .gap-16 { gap: 16px; } .gap-24 { gap: 24px; }
.mt-8 { margin-top: 8px; } .mt-16 { margin-top: 16px; } .mt-24 { margin-top: 24px; }

/* ---------------------------- BOTÕES ---------------------------- */

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 1px solid transparent; border-radius: 10px;
  padding: 9px 16px; font-weight: 550; font-size: 13px;
  transition: transform 0.12s ease, background 0.18s ease, box-shadow 0.18s ease, opacity 0.18s;
  white-space: nowrap; user-select: none;
}
.btn:active { transform: translateY(1px) scale(0.995); }
.btn:disabled { opacity: 0.55; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #fff; box-shadow: 0 6px 18px -10px var(--accent); }
.btn-primary:hover:not(:disabled) { background: var(--accent-strong); }
.btn-outline { background: var(--bg-elevated); color: var(--text); border-color: var(--border-strong); }
.btn-outline:hover:not(:disabled) { border-color: var(--accent); color: var(--accent-strong); }
.btn-ghost { background: transparent; color: var(--text-soft); }
.btn-ghost:hover:not(:disabled) { background: var(--bg-muted); color: var(--text); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger:hover:not(:disabled) { filter: brightness(1.08); }
.btn-soft { background: var(--accent-soft); color: var(--accent-strong); }
.btn-sm { padding: 6px 11px; font-size: 12px; border-radius: 8px; }
.btn-lg { padding: 13px 22px; font-size: 15px; border-radius: 12px; }
.btn-block { width: 100%; }
.btn-icon { padding: 8px; border-radius: 9px; line-height: 0; }

/* ---------------------------- CARDS ---------------------------- */

.card {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
}
.card-pad { padding: 18px; }
.card-head {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 14px 18px; border-bottom: 1px solid var(--border);
}
.card-title { font-size: 14px; font-weight: 600; }
.card-body { padding: 18px; }

.grid { display: grid; gap: 14px; }
.grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.grid-auto { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }

/* ---------------------------- FORMULÁRIOS ---------------------------- */

.field { display: grid; gap: 6px; }
.field > label { font-size: 12px; font-weight: 550; color: var(--text-soft); }
.field .hint { font-size: 11px; color: var(--text-faint); }
.input, .select, .textarea {
  width: 100%; padding: 10px 12px;
  background: var(--bg-elevated); color: var(--text);
  border: 1px solid var(--border-strong); border-radius: 10px;
  transition: border-color 0.16s ease, box-shadow 0.16s ease, background 0.16s;
  outline: none;
}
.input:focus, .select:focus, .textarea:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent);
}
.input::placeholder, .textarea::placeholder { color: var(--text-faint); }
.input.invalid, .select.invalid { border-color: var(--danger); }
.textarea { min-height: 84px; resize: vertical; }
.field-error { font-size: 11px; color: var(--danger); min-height: 0; }
.check { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.check input { width: 15px; height: 15px; accent-color: var(--accent); }

.input-group { position: relative; }
.input-group .input { padding-left: 38px; }
.input-group .icon-left {
  position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
  color: var(--text-faint); line-height: 0; pointer-events: none;
}
.input-group .icon-right {
  position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
  background: none; border: 0; color: var(--text-faint); padding: 4px; border-radius: 6px; line-height: 0;
}
.input-group .icon-right:hover { color: var(--text); background: var(--bg-muted); }

.password-meter { display: flex; gap: 4px; margin-top: 6px; }
.password-meter span { height: 4px; flex: 1; border-radius: 4px; background: var(--bg-muted); transition: background 0.2s; }
.password-meter[data-score="1"] span:nth-child(1) { background: var(--danger); }
.password-meter[data-score="2"] span:nth-child(-n+2) { background: var(--warning); }
.password-meter[data-score="3"] span:nth-child(-n+3) { background: var(--info); }
.password-meter[data-score="4"] span { background: var(--success); }

/* ---------------------------- BADGES / TAGS ---------------------------- */

.badge {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 600;
  background: var(--bg-muted); color: var(--text-soft); white-space: nowrap;
}
.badge-accent { background: var(--accent-soft); color: var(--accent-strong); }
.badge-success { background: var(--success-soft); color: var(--success); }
.badge-danger { background: var(--danger-soft); color: var(--danger); }
.badge-warning { background: var(--warning-soft); color: var(--warning); }
.badge-info { background: var(--info-soft); color: var(--info); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

/* ---------------------------- LOGIN / CADASTRO ---------------------------- */

.auth-shell {
  min-height: 100dvh; display: grid; grid-template-columns: 1.05fr 1fr;
}
.auth-brand {
  position: relative; overflow: hidden;
  background: linear-gradient(160deg, #17141c 0%, #241d1a 45%, #3a2c1d 100%);
  color: #f6efe3; padding: 48px; display: flex; flex-direction: column; justify-content: space-between;
}
.auth-brand::before {
  content: ""; position: absolute; inset: -40% -20% auto auto; width: 620px; height: 620px;
  background: radial-gradient(circle, rgba(201, 162, 39, 0.42), transparent 62%);
  filter: blur(10px); animation: float 14s ease-in-out infinite;
}
.auth-brand::after {
  content: ""; position: absolute; inset: auto -10% -30% -10%; height: 460px;
  background: radial-gradient(circle at 30% 70%, rgba(216, 160, 166, 0.32), transparent 60%);
  filter: blur(6px); animation: float 18s ease-in-out infinite reverse;
}
@keyframes float {
  0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
  50% { transform: translate3d(-28px, 26px, 0) scale(1.06); }
}
.auth-brand-inner { position: relative; z-index: 1; }
.auth-logo { display: flex; align-items: center; gap: 12px; font-family: var(--font-display); font-size: 22px; letter-spacing: 0.16em; text-transform: uppercase; }
.auth-logo-mark {
  width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center;
  background: linear-gradient(140deg, #e8c766, #b08d3f); color: #1b1408; font-weight: 700;
  font-family: var(--font-sans); letter-spacing: 0; font-size: 17px;
  box-shadow: 0 10px 30px -12px rgba(232, 199, 102, 0.9);
}
.auth-headline {
  font-family: var(--font-display); font-size: 46px; line-height: 1.08; margin-top: 40px; font-weight: 500;
  letter-spacing: -0.02em;
}
.auth-headline em { font-style: italic; color: #e8c766; }
.auth-sub { margin-top: 16px; font-size: 14px; color: rgba(246, 239, 227, 0.72); max-width: 420px; line-height: 1.65; }
.auth-features { margin-top: 36px; display: grid; gap: 12px; }
.auth-feature { display: flex; gap: 11px; align-items: flex-start; font-size: 13px; color: rgba(246, 239, 227, 0.86); }
.auth-feature svg { flex-shrink: 0; margin-top: 1px; color: #e8c766; }
.auth-foot { position: relative; z-index: 1; font-size: 11.5px; color: rgba(246, 239, 227, 0.45); line-height: 1.7; }

.auth-panel {
  display: flex; align-items: center; justify-content: center; padding: 40px 28px;
  background: var(--bg); overflow-y: auto;
}
.auth-card { width: 100%; max-width: 420px; animation: rise 0.45s ease both; }
@keyframes rise {
  from { opacity: 0; transform: translateY(14px); }
  to { opacity: 1; transform: none; }
}
.auth-tabs {
  display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px;
  background: var(--bg-muted); border-radius: 12px; margin-bottom: 22px;
}
.auth-tab {
  border: 0; background: transparent; padding: 9px; border-radius: 9px;
  font-size: 13px; font-weight: 600; color: var(--text-soft); transition: all 0.18s;
}
.auth-tab[aria-selected="true"] { background: var(--bg-elevated); color: var(--text); box-shadow: var(--shadow-sm); }
.auth-form { display: grid; gap: 14px; }

/* ---------------------------- APP SHELL ---------------------------- */

.app-shell { display: grid; grid-template-columns: 248px 1fr; min-height: 100dvh; }
.sidebar {
  background: var(--bg-sidebar); color: #e9e3d9; padding: 20px 14px;
  display: flex; flex-direction: column; gap: 22px; position: sticky; top: 0; height: 100dvh;
}
.sidebar-logo { display: flex; align-items: center; gap: 11px; padding: 4px 8px 0; }
.brand-mark-img {
  width: 40px; height: 40px; flex-shrink: 0; border-radius: 11px;
  background: #f6f2e9; padding: 3px; box-shadow: 0 1px 3px rgba(0,0,0,.28);
}
.sidebar-logo-text {
  font-family: var(--font-display); font-size: 15px; letter-spacing: 0.06em;
  text-transform: uppercase; line-height: 1.1; color: #f2e7cf;
}
.sidebar-logo-text small {
  display: block; font-family: var(--font-body, inherit); font-size: 9.5px;
  letter-spacing: 0.28em; color: rgba(232, 199, 102, 0.85); text-transform: uppercase; margin-top: 2px;
}
.sidebar-store { font-size: 10.5px; color: rgba(233, 227, 217, 0.45); letter-spacing: 0.04em; padding: 0 10px; margin-top: -14px; }
.nav { display: grid; gap: 3px; }
.nav-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; color: rgba(233, 227, 217, 0.34); padding: 10px 10px 4px; }
.nav-item {
  display: flex; align-items: center; gap: 11px; padding: 10px 11px; border-radius: 10px;
  color: rgba(233, 227, 217, 0.72); background: none; border: 0; text-align: left; width: 100%;
  font-size: 13px; font-weight: 500; transition: background 0.16s, color 0.16s, transform 0.16s;
}
.nav-item:hover { background: rgba(255, 255, 255, 0.06); color: #fff; }
.nav-item.active {
  background: linear-gradient(100deg, rgba(232, 199, 102, 0.18), rgba(232, 199, 102, 0.04));
  color: #f4e4b8; box-shadow: inset 0 0 0 1px rgba(232, 199, 102, 0.2);
}
.nav-item svg { flex-shrink: 0; opacity: 0.9; }
.nav-item .nav-count {
  margin-left: auto; font-size: 10.5px; background: rgba(255, 255, 255, 0.1);
  padding: 1px 7px; border-radius: 999px; color: inherit;
}
.sidebar-foot { margin-top: auto; display: grid; gap: 8px; }
.storage-chip {
  font-size: 10.5px; color: rgba(233, 227, 217, 0.62); background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255,255,255,.07);
  border-radius: 9px; padding: 9px 11px; line-height: 1.45; cursor: pointer;
  display: flex; align-items: center; gap: 7px; text-align: left; width: 100%;
  transition: background .16s, border-color .16s, transform .16s;
}
.storage-chip:hover { background: rgba(255, 255, 255, 0.09); transform: translateY(-1px); }
.storage-chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.storage-chip svg { flex-shrink: 0; }
.storage-chip strong { color: rgba(233, 227, 217, 0.85); font-weight: 600; }
.storage-chip.chip-ok { border-color: rgba(126, 200, 150, 0.35); color: rgba(190, 235, 200, 0.92); background: rgba(126,200,150,.1); }
.storage-chip.chip-warn { border-color: rgba(232, 199, 102, 0.35); color: rgba(244, 228, 184, 0.95); background: rgba(232,199,102,.09); }
.storage-note { font-size: 10px; color: rgba(233, 227, 217, 0.34); padding: 0 4px; text-align: center; }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; gap: 14px; padding: 12px 24px;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(12px); border-bottom: 1px solid var(--border);
}
.topbar h1 { font-size: 21px; }
.topbar-sub { font-size: 11.5px; color: var(--text-soft); }
.topbar-search { margin-left: auto; width: 260px; }
.view { padding: 22px 24px 60px; max-width: 1440px; width: 100%; }

.avatar-btn {
  border: 0; background: none; padding: 0; border-radius: 50%; line-height: 0;
  box-shadow: 0 0 0 2px transparent; transition: box-shadow 0.18s;
}
.avatar-btn:hover { box-shadow: 0 0 0 2px var(--accent); }

.avatar {
  border-radius: 50%; object-fit: cover; background: var(--accent-soft); color: var(--accent-strong);
  display: grid; place-items: center; font-weight: 700; flex-shrink: 0; overflow: hidden;
  border: 1px solid var(--border);
}
.avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
.avatar-sm { width: 32px; height: 32px; font-size: 12px; }
.avatar-md { width: 44px; height: 44px; font-size: 15px; }
.avatar-lg { width: 96px; height: 96px; font-size: 30px; }
.avatar-xl { width: 132px; height: 132px; font-size: 40px; }

/* ---------------------------- KPI ---------------------------- */

.kpi { display: flex; align-items: flex-start; gap: 12px; padding: 16px; }
.kpi-icon {
  width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; flex-shrink: 0;
  background: var(--accent-soft); color: var(--accent-strong);
}
.kpi-icon.success { background: var(--success-soft); color: var(--success); }
.kpi-icon.danger { background: var(--danger-soft); color: var(--danger); }
.kpi-icon.info { background: var(--info-soft); color: var(--info); }
.kpi-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-faint); }
.kpi-value { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.kpi-foot { font-size: 11px; color: var(--text-soft); }

/* ---------------------------- TABELAS ---------------------------- */

.table-wrap { overflow-x: auto; }
table.data { width: 100%; border-collapse: collapse; font-size: 13px; }
table.data th {
  text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.07em;
  color: var(--text-faint); font-weight: 600; padding: 10px 14px; border-bottom: 1px solid var(--border);
  white-space: nowrap; background: color-mix(in srgb, var(--bg-muted) 55%, transparent);
}
table.data td { padding: 11px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
table.data tbody tr { transition: background 0.13s; }
table.data tbody tr:hover { background: color-mix(in srgb, var(--bg-muted) 55%, transparent); }
table.data tbody tr:last-child td { border-bottom: 0; }
table.data .actions { display: flex; gap: 4px; justify-content: flex-end; }
.thumb {
  width: 38px; height: 38px; border-radius: 9px; object-fit: cover; background: var(--bg-muted);
  border: 1px solid var(--border); display: grid; place-items: center; color: var(--text-faint);
  font-size: 11px; font-weight: 700; flex-shrink: 0; overflow: hidden;
}
.thumb img { width: 100%; height: 100%; object-fit: cover; }

/* ---------------------------- PDV ---------------------------- */

.pos { display: grid; grid-template-columns: 1fr 400px; gap: 16px; align-items: start; }
.pos-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.pos-card {
  background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius);
  overflow: hidden; text-align: left; padding: 0; transition: transform 0.14s, box-shadow 0.14s, border-color 0.14s;
  display: flex; flex-direction: column;
}
.pos-card:hover:not(:disabled) { transform: translateY(-2px); box-shadow: var(--shadow); border-color: var(--accent); }
.pos-card:disabled { opacity: 0.5; cursor: not-allowed; }
.pos-media {
  aspect-ratio: 4 / 3; background: var(--bg-muted); display: grid; place-items: center;
  color: var(--text-faint); overflow: hidden;
}
.pos-media img { width: 100%; height: 100%; object-fit: cover; }
.pos-body { padding: 9px 11px 12px; display: grid; gap: 2px; }
.pos-name { font-size: 12.5px; font-weight: 600; line-height: 1.3; }
.pos-price { font-size: 13px; font-weight: 700; color: var(--accent-strong); font-variant-numeric: tabular-nums; }
.pos-meta { font-size: 10.5px; color: var(--text-faint); }

.cart { position: sticky; top: 76px; display: grid; gap: 0; overflow: hidden; }
.cart-items { max-height: 340px; overflow-y: auto; }
.cart-line { display: flex; align-items: center; gap: 10px; padding: 9px 16px; border-bottom: 1px solid var(--border); }
.cart-line:last-child { border-bottom: 0; }
.cart-line-name { font-size: 12.5px; font-weight: 550; }
.qty { display: inline-flex; align-items: center; border: 1px solid var(--border-strong); border-radius: 8px; overflow: hidden; }
.qty button { border: 0; background: var(--bg-elevated); color: var(--text); padding: 3px 8px; font-size: 13px; line-height: 1; }
.qty button:hover { background: var(--bg-muted); }
.qty span { min-width: 26px; text-align: center; font-size: 12px; font-variant-numeric: tabular-nums; }
.cart-summary { padding: 14px 16px; display: grid; gap: 7px; border-top: 1px solid var(--border); background: color-mix(in srgb, var(--bg-muted) 45%, transparent); }
.sum-row { display: flex; justify-content: space-between; font-size: 12.5px; }
.sum-row.total { font-size: 18px; font-weight: 700; padding-top: 7px; border-top: 1px dashed var(--border-strong); margin-top: 3px; }
.sum-row.total span:last-child { color: var(--accent-strong); }
.cart-actions { padding: 0 16px 16px; display: grid; gap: 8px; }

/* ---------------------------- PERFIL ---------------------------- */

.profile-hero {
  position: relative; overflow: hidden; border-radius: var(--radius-lg);
  background: linear-gradient(130deg, #1a1721, #2a211a 60%, #3b2e1c);
  padding: 26px; color: #f6efe3; display: flex; gap: 20px; align-items: center; flex-wrap: wrap;
}
.profile-hero::after {
  content: ""; position: absolute; inset: -60% -10% auto auto; width: 420px; height: 420px;
  background: radial-gradient(circle, rgba(232, 199, 102, 0.28), transparent 65%);
}
.profile-hero > * { position: relative; z-index: 1; }
.profile-hero h2 { font-family: var(--font-display); font-size: 27px; font-weight: 500; }
.avatar-editor { position: relative; flex-shrink: 0; }
.avatar-editor .avatar { border: 3px solid rgba(255, 255, 255, 0.2); }
.avatar-edit-btn {
  position: absolute; right: -3px; bottom: -3px; width: 32px; height: 32px; border-radius: 50%;
  background: #f4e4b8; color: #1b1408; border: 2px solid #2a211a; display: grid; place-items: center;
  box-shadow: var(--shadow); transition: transform 0.15s;
}
.avatar-edit-btn:hover { transform: scale(1.08); }
.dropzone {
  border: 1.5px dashed var(--border-strong); border-radius: var(--radius); padding: 18px;
  text-align: center; color: var(--text-soft); font-size: 12.5px; transition: all 0.18s; cursor: pointer;
  background: color-mix(in srgb, var(--bg-muted) 40%, transparent);
}
.dropzone:hover, .dropzone.drag { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-strong); }

/* ---------------------------- MODAIS / TOASTS ---------------------------- */

.modal-backdrop {
  position: fixed; inset: 0; z-index: 100; background: rgba(16, 14, 12, 0.55);
  backdrop-filter: blur(3px); display: grid; place-items: center; padding: 20px;
  animation: fade 0.18s ease both; overflow-y: auto;
}
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.modal {
  background: var(--bg-elevated); border-radius: var(--radius-lg); width: 100%; max-width: 520px;
  box-shadow: var(--shadow-lg); border: 1px solid var(--border);
  animation: pop 0.24s cubic-bezier(0.2, 0.9, 0.3, 1.2) both; max-height: calc(100dvh - 40px);
  display: flex; flex-direction: column;
}
.modal.wide { max-width: 760px; }
.modal.small { max-width: 400px; }
@keyframes pop {
  from { opacity: 0; transform: translateY(16px) scale(0.97); }
  to { opacity: 1; transform: none; }
}
.modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 18px 20px 12px; }
.modal-head h3 { font-size: 16px; }
.modal-body { padding: 0 20px 18px; overflow-y: auto; }
.modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--border); background: color-mix(in srgb, var(--bg-muted) 45%, transparent); border-radius: 0 0 var(--radius-lg) var(--radius-lg); }

.toasts { position: fixed; right: 18px; bottom: 18px; z-index: 200; display: grid; gap: 8px; max-width: 360px; }
.toast {
  display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 12px;
  background: var(--bg-elevated); border: 1px solid var(--border); box-shadow: var(--shadow-lg);
  animation: slide-in 0.26s cubic-bezier(0.2, 0.9, 0.3, 1.1) both; font-size: 12.5px;
}
.toast.out { animation: slide-out 0.2s ease both; }
@keyframes slide-in { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: none; } }
@keyframes slide-out { to { opacity: 0; transform: translateX(24px); } }
.toast-icon { flex-shrink: 0; margin-top: 1px; }
.toast.success { border-left: 3px solid var(--success); }
.toast.success .toast-icon { color: var(--success); }
.toast.error { border-left: 3px solid var(--danger); }
.toast.error .toast-icon { color: var(--danger); }
.toast.info { border-left: 3px solid var(--info); }
.toast.info .toast-icon { color: var(--info); }
.toast.warning { border-left: 3px solid var(--warning); }
.toast.warning .toast-icon { color: var(--warning); }
.toast-title { font-weight: 600; }
.toast-msg { color: var(--text-soft); font-size: 11.5px; }

/* ---------------------------- CHARTS ---------------------------- */

.chart-bars { display: flex; align-items: flex-end; gap: 6px; height: 148px; padding-top: 8px; }
.chart-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
.chart-bar {
  width: 100%; border-radius: 5px 5px 2px 2px; min-height: 3px;
  background: linear-gradient(180deg, var(--accent), color-mix(in srgb, var(--accent) 55%, transparent));
  transition: height 0.6s cubic-bezier(0.2, 0.8, 0.2, 1), filter 0.15s;
  position: relative;
}
.chart-col:hover .chart-bar { filter: brightness(1.12); }
.chart-label { font-size: 9.5px; color: var(--text-faint); white-space: nowrap; }
.chart-value { position: absolute; top: -18px; left: 50%; transform: translateX(-50%); font-size: 9.5px; color: var(--text-soft); opacity: 0; transition: opacity 0.15s; white-space: nowrap; }
.chart-col:hover .chart-value { opacity: 1; }

.progress { height: 6px; border-radius: 6px; background: var(--bg-muted); overflow: hidden; }
.progress > span { display: block; height: 100%; background: var(--accent); border-radius: 6px; transition: width 0.5s ease; }

/* ---------------------------- EMPTY / SKELETON ---------------------------- */

.empty { text-align: center; padding: 40px 20px; color: var(--text-soft); display: grid; gap: 8px; place-items: center; }
.empty-icon {
  width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center;
  background: var(--bg-muted); color: var(--text-faint);
}
.empty h3 { font-size: 14px; color: var(--text); }
.empty p { font-size: 12px; max-width: 320px; }

/* ---------------------------- SEGMENTED ---------------------------- */

.segmented { display: inline-flex; padding: 3px; background: var(--bg-muted); border-radius: 10px; gap: 2px; }
.segmented button {
  border: 0; background: transparent; padding: 6px 12px; border-radius: 8px;
  font-size: 12px; font-weight: 550; color: var(--text-soft); transition: all 0.16s;
}
.segmented button[aria-pressed="true"] { background: var(--bg-elevated); color: var(--text); box-shadow: var(--shadow-sm); }

.swatches { display: flex; gap: 9px; flex-wrap: wrap; }
.swatch {
  width: 30px; height: 30px; border-radius: 50%; border: 2px solid transparent; cursor: pointer;
  transition: transform 0.15s; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.12);
}
.swatch:hover { transform: scale(1.1); }
.swatch[aria-pressed="true"] { border-color: var(--text); transform: scale(1.06); }

/* ---------------------------- BANNER ---------------------------- */

.banner {
  display: flex; gap: 11px; align-items: flex-start; padding: 12px 14px; border-radius: 12px;
  font-size: 12px; line-height: 1.55;
}
.banner svg { flex-shrink: 0; margin-top: 1px; }
.banner-info { background: var(--info-soft); color: var(--info); }
.banner-warning { background: var(--warning-soft); color: var(--warning); }
.banner-accent { background: var(--accent-soft); color: var(--accent-strong); }
.banner-danger { background: var(--danger-soft); color: var(--danger); }
.banner strong { font-weight: 650; }

/* ---------------------------- CALENDÁRIO ---------------------------- */

.cal-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
.cal-head strong { font-family: var(--font-display, Georgia, serif); font-size: 15px; text-transform: capitalize; letter-spacing: .01em; }
.cal-nav {
  width: 30px; height: 30px; border-radius: 9px; border: 1px solid var(--border);
  background: var(--bg-elevated); color: var(--text-soft); font-size: 16px; line-height: 1;
  display: grid; place-items: center; transition: all .18s ease;
}
.cal-nav:hover { background: var(--bg-muted); color: var(--text); transform: translateY(-1px); }
.cal-week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 6px; }
.cal-week span { text-align: center; font-size: 9.5px; text-transform: uppercase; letter-spacing: .09em; color: var(--text-faint); }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal-empty { aspect-ratio: 1; }
.cal-day {
  position: relative; aspect-ratio: 1; border-radius: 10px; border: 1px solid transparent;
  background: var(--bg-muted); color: var(--text-soft); font-size: 12px; font-weight: 550;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  transition: transform .16s ease, box-shadow .18s ease, background .18s ease, color .18s ease;
}
.cal-day:hover { transform: translateY(-2px) scale(1.03); box-shadow: var(--shadow-sm); color: var(--text); }
.cal-day.has-sales { background: color-mix(in srgb, var(--accent) 14%, var(--bg-elevated)); color: var(--text); }
.cal-day.has-sales.has-money { background: color-mix(in srgb, var(--accent) 26%, var(--bg-elevated)); }
.cal-day.has-open { box-shadow: inset 0 0 0 1.5px var(--warning); }
.cal-day.is-today .cal-num { color: var(--accent-strong); font-weight: 750; }
.cal-day.is-today::after {
  content: ""; position: absolute; bottom: 5px; width: 4px; height: 4px; border-radius: 50%; background: var(--accent-strong);
}
.cal-day.is-selected { background: var(--accent); color: #fff; box-shadow: 0 6px 16px color-mix(in srgb, var(--accent) 40%, transparent); }
.cal-day.is-selected .cal-num, .cal-day.is-selected .cal-flag { color: #fff; }
.cal-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--accent-strong); }
.cal-day.is-selected .cal-dot { background: rgba(255,255,255,.9); }
.cal-flag { font-size: 7px; letter-spacing: .06em; text-transform: uppercase; color: var(--warning); }

/* ---------------------------- GRÁFICO DE ÁREA ---------------------------- */

.area-chart { width: 100%; height: 150px; display: block; overflow: visible; }
.area-line {
  stroke-dasharray: 2400; stroke-dashoffset: 2400;
  animation: draw-line 1.15s cubic-bezier(.3,.7,.2,1) forwards;
}
.area-fill { opacity: 0; animation: fade-in .9s ease .25s forwards; }
.area-dot { fill: var(--bg-elevated); stroke: #b08d3f; stroke-width: 2; opacity: 0; animation: fade-in .5s ease .55s forwards; transition: r .15s ease; }
.area-chart:hover .area-dot { r: 4.4; }
.area-labels { display: flex; justify-content: space-between; gap: 4px; margin-top: 6px; font-size: 9.5px; color: var(--text-faint); }
@keyframes draw-line { to { stroke-dashoffset: 0; } }
@keyframes fade-in { to { opacity: 1; } }

/* ---------------------------- CAIXA ---------------------------- */

.cash-close-summary { background: var(--bg-muted); border-radius: 12px; padding: 12px 14px; }
.receipt-preview {

  </div>

  <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
  <noscript>

    </div>

  <script>
/*
 * Regras de negócio do app — funções puras (sem DOM, sem storage).
 * Este arquivo roda tanto no navegador quanto no Node (testes).
 */
(function (root, factory) {
  if (typeof module === "object" && module.exports) module.exports = factory();
  else root.PassarelaCore = factory();
})(typeof globalThis !== "undefined" ? globalThis : this, function () {
  "use strict";

  /* ------------------------------------------------------------------ *
   * Utilidades numéricas (dinheiro em centavos inteiros — sem erro de
   * ponto flutuante em somas de venda)
   * ------------------------------------------------------------------ */

  function toCents(value) {
    var n = Number(value);
    if (!isFinite(n)) return 0;
    return Math.round(n * 100);
  }

  function fromCents(cents) {
    return (Number(cents || 0) / 100).toFixed(2);
  }

  /**
   * Formata dinheiro em reais.
   * - número  → já está em REAIS (ex.: 189.9 → "R$ 189,90")
   * - texto   → aceita "189,90", "189.90" ou "1.299,90"
   */
  function brl(value) {
    var cents;
    if (typeof value === "string") {
      cents = toCents(parseMoneyInput(value));
    } else {
      cents = Math.round((Number(value) || 0) * 100);
    }
    var negative = cents < 0;
    var abs = Math.abs(cents);
    var reais = String(Math.floor(abs / 100));
    var centavos = String(abs % 100).padStart(2, "0");
    reais = reais.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    return (negative ? "-" : "") + "R$ " + reais + "," + centavos;
  }

  function parseMoneyInput(text) {
    if (text === null || text === undefined) return 0;
    var clean = String(text).replace(/[^\d,.-]/g, "").trim();
    if (!clean) return 0;
    if (clean.indexOf(",") > -1) clean = clean.replace(/\./g, "").replace(",", ".");
    var n = parseFloat(clean);
    if (!isFinite(n)) return 0;
    return Math.round(n * 100) / 100;
  }

  function round2(value) {
    return Math.round((Number(value) || 0) * 100) / 100;
  }

  /* ------------------------------------------------------------------ *
   * Validações (CPF/CNPJ/e-mail/telefone) — algoritmo oficial
   * ------------------------------------------------------------------ */

  function onlyDigits(text) {
    return String(text || "").replace(/\D/g, "");
  }

  function isValidCPF(input) {
    var cpf = onlyDigits(input);
    if (cpf.length !== 11) return false;
    if (/^(\d)\1{10}$/.test(cpf)) return false;
    var sum = 0;
    for (var i = 0; i < 9; i++) sum += parseInt(cpf[i], 10) * (10 - i);
    var d1 = (sum * 10) % 11;
    if (d1 === 10) d1 = 0;
    if (d1 !== parseInt(cpf[9], 10)) return false;
    sum = 0;
    for (var j = 0; j < 10; j++) sum += parseInt(cpf[j], 10) * (11 - j);
    var d2 = (sum * 10) % 11;
    if (d2 === 10) d2 = 0;
    return d2 === parseInt(cpf[10], 10);
  }

  function isValidCNPJ(input) {
    var cnpj = onlyDigits(input);
    if (cnpj.length !== 14) return false;
    if (/^(\d)\1{13}$/.test(cnpj)) return false;
    var weights1 = [5, 4, 3, 2, 9, 8, 7, 6, 5, 4, 3, 2];
    var weights2 = [6, 5, 4, 3, 2, 9, 8, 7, 6, 5, 4, 3, 2];
    var sum = 0;
    for (var i = 0; i < 12; i++) sum += parseInt(cnpj[i], 10) * weights1[i];
    var d1 = sum % 11 < 2 ? 0 : 11 - (sum % 11);
    if (d1 !== parseInt(cnpj[12], 10)) return false;
    sum = 0;
    for (var j = 0; j < 13; j++) sum += parseInt(cnpj[j], 10) * weights2[j];
    var d2 = sum % 11 < 2 ? 0 : 11 - (sum % 11);
    return d2 === parseInt(cnpj[13], 10);
  }

  function maskCPF(value) {
    var v = onlyDigits(value).slice(0, 11);
    return v
      .replace(/^(\d{3})(\d)/, "$1.$2")
      .replace(/^(\d{3})\.(\d{3})(\d)/, "$1.$2.$3")
      .replace(/\.(\d{3})(\d{1,2})$/, ".$1-$2");
  }

  function maskCNPJ(value) {
    var v = onlyDigits(value).slice(0, 14);
    return v
      .replace(/^(\d{2})(\d)/, "$1.$2")
      .replace(/^(\d{2})\.(\d{3})(\d)/, "$1.$2.$3")
      .replace(/\.(\d{3})(\d)/, ".$1/$2")
      .replace(/(\d{4})(\d{1,2})$/, "$1-$2");
  }

  function maskPhone(value) {
    var v = onlyDigits(value).slice(0, 11);
    if (v.length <= 10) {
      return v.replace(/^(\d{2})(\d)/, "($1) $2").replace(/(\d{4})(\d{1,4})$/, "$1-$2");
    }
    return v.replace(/^(\d{2})(\d)/, "($1) $2").replace(/(\d{5})(\d{1,4})$/, "$1-$2");
  }

  function isValidEmail(text) {
    return /^[^\s@]+@[^\s@]+\.[a-zA-Z]{2,}$/.test(String(text || "").trim());
  }

  /* ------------------------------------------------------------------ *
   * Senha
   * ------------------------------------------------------------------ */

  function validatePasswordStrength(password) {
    var p = String(password || "");
    if (p.length < 8) return "A senha deve ter pelo menos 8 caracteres.";
    if (!/[a-zA-Z]/.test(p)) return "A senha deve conter ao menos uma letra.";
    if (!/[0-9]/.test(p)) return "A senha deve conter ao menos um número.";
    if (
      ["12345678", "senha123", "password", "admin123", "passarela", "87654321", "qwerty123"].indexOf(
        p.toLowerCase()
      ) > -1
    ) {
      return "Esta senha é muito comum. Escolha outra.";
    }
    return null;
  }

  function passwordScore(password) {
    var p = String(password || "");
    var score = 0;
    if (p.length >= 8) score++;
    if (p.length >= 12) score++;
    if (/[a-z]/.test(p) && /[A-Z]/.test(p)) score++;
    if (/\d/.test(p)) score++;
    if (/[^\w\s]/.test(p)) score++;
    return Math.min(4, score);
  }

  /* ------------------------------------------------------------------ *
   * Formatos de data
   * ------------------------------------------------------------------ */

  function todayKey(date) {
    var d = date || new Date();
    return (
      d.getFullYear() +
      "-" +
      String(d.getMonth() + 1).padStart(2, "0") +
      "-" +
      String(d.getDate()).padStart(2, "0")
    );
  }

  function nowIso() {
    return new Date().toISOString();
  }

  function formatDateBR(value) {
    if (!value) return "—";
    var raw = String(value);
    var dateOnly = /^(\d{4})-(\d{2})-(\d{2})$/.exec(raw);
    if (dateOnly) return dateOnly[3] + "/" + dateOnly[2] + "/" + dateOnly[1];
    var d = new Date(raw);
    if (isNaN(d.getTime())) return "—";
    return String(d.getDate()).padStart(2, "0") + "/" + String(d.getMonth() + 1).padStart(2, "0") + "/" + d.getFullYear();
  }

  function formatTimeBR(value) {
    if (!value) return "--:--";
    var d = new Date(value);
    if (isNaN(d.getTime())) return "--:--";
    return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  }

  function formatDateTimeBR(value) {
    if (!value) return "—";
    var d = new Date(value);
    if (isNaN(d.getTime())) return "—";
    return (
      formatDateBR(todayKey(d)) +
      " " +
      String(d.getHours()).padStart(2, "0") +
      ":" +
      String(d.getMinutes()).padStart(2, "0")
    );
  }

  /* ------------------------------------------------------------------ *
   * Vendas
   * ------------------------------------------------------------------ */

  /**
   * Calcula totais de uma venda. Todos os valores em REAIS (number),
   * aritmética em centavos para não acumular erro.
   * items: [{ unitPrice, quantity, discount }]
   */
  function computeSaleTotals(payload) {
    var data = payload || {};
    var items = Array.isArray(data.items) ? data.items : [];
    var subtotalCents = 0;
    var itemDiscountCents = 0;
    var lines = [];

    for (var i = 0; i < items.length; i++) {
      var item = items[i];
      var qty = Math.max(1, Math.floor(Number(item.quantity) || 1));
      var unitCents = toCents(item.unitPrice);
      var lineCents = unitCents * qty;
      var discountCents = Math.min(lineCents, Math.max(0, toCents(item.discount)));
      subtotalCents += lineCents;
      itemDiscountCents += discountCents;
      lines.push({
        id: item.id,
        quantity: qty,
        unitPriceCents: unitCents,
        lineTotalCents: lineCents - discountCents,
        discountCents: discountCents
      });
    }

    var globalDiscountCents = Math.min(
      subtotalCents - itemDiscountCents,
      Math.max(0, toCents(data.discount))
    );
    var surchargeCents = Math.max(0, toCents(data.surcharge));
    var totalCents = subtotalCents - itemDiscountCents - globalDiscountCents + surchargeCents;

    var paidCents = Math.max(0, toCents(data.paidAmount));
    var changeCents = Math.max(0, paidCents - totalCents);
    var balanceCents = Math.max(0, totalCents - paidCents);

    return {
      lines: lines,
      subtotal: fromCents(subtotalCents),
      discount: fromCents(itemDiscountCents + globalDiscountCents),
      surcharge: fromCents(surchargeCents),
      total: fromCents(totalCents),
      totalCents: totalCents,
      paid: fromCents(paidCents),
      change: fromCents(changeCents),
      balance: fromCents(balanceCents),
      itemCount: lines.reduce(function (acc, l) {
        return acc + l.quantity;
      }, 0)
    };
  }

  /** Estoque suficiente? Devolve lista de itens com problema. */
  function stockIssues(items, productIndex) {
    var problems = [];
    for (var i = 0; i < (items || []).length; i++) {
      var item = items[i];
      var available = productIndex && productIndex[item.productId] ? Number(productIndex[item.productId].stock) : 0;
      if (!productIndex[item.productId]) {
        problems.push({ productId: item.productId, reason: "Produto não encontrado" });
      } else if (Number(item.quantity) > available) {
        problems.push({
          productId: item.productId,
          reason: "Estoque insuficiente (disponível: " + available + ")"
        });
      }
    }
    return problems;
  }

  /** Próximo número sequencial formatado (ex.: V-000123). */
  function nextCode(prefix, lastNumber, padding) {
    var n = (Number(lastNumber) || 0) + 1;
    return prefix + String(n).padStart(padding || 6, "0");
  }

  /* ------------------------------------------------------------------ *
   * DRE / resumo financeiro
   * ------------------------------------------------------------------ */

  /**
   * payments: [{ method, amount }], despesas: [{ amount, category }]
   */
  function financialSummary(payload) {
    var data = payload || {};
    var payments = Array.isArray(data.payments) ? data.payments : [];
    var expenses = Array.isArray(data.expenses) ? data.expenses : [];
    var byMethod = {};
    var grossCents = 0;
    for (var i = 0; i < payments.length; i++) {
      var cents = toCents(payments[i].amount);
      grossCents += cents;
      var method = payments[i].method || "OUTRO";
      byMethod[method] = (byMethod[method] || 0) + cents;
    }
    var expenseCents = 0;
    var expenseByCategory = {};
    for (var j = 0; j < expenses.length; j++) {
      var e = toCents(expenses[j].amount);
      expenseCents += e;
      var cat = expenses[j].category || "Outros";
      expenseByCategory[cat] = (expenseByCategory[cat] || 0) + e;
    }
    var cogsCents = toCents(data.costOfGoods);
    var resultCents = grossCents - cogsCents - expenseCents;

    var methods = Object.keys(byMethod).map(function (key) {
      return { method: key, amount: fromCents(byMethod[key]) };
    });
    var categories = Object.keys(expenseByCategory).map(function (key) {
      return { category: key, amount: fromCents(expenseByCategory[key]) };
    });

    return {
      gross: fromCents(grossCents),
      costOfGoods: fromCents(cogsCents),
      expenses: fromCents(expenseCents),
      result: fromCents(resultCents),
      marginPercent: grossCents ? round2((resultCents / grossCents) * 100) : 0,
      byMethod: methods,
      expenseByCategory: categories
    };
  }

  /* ------------------------------------------------------------------ *
   * Agregações para dashboard
   * ------------------------------------------------------------------ */

  function sumBy(list, picker) {
    return (list || []).reduce(function (acc, item) {
      return acc + (Number(picker(item)) || 0);
    }, 0);
  }

  function groupSum(list, keyFn, valueFn) {
    var map = {};
    (list || []).forEach(function (item) {
      var key = keyFn(item);
      map[key] = (map[key] || 0) + (Number(valueFn(item)) || 0);
    });
    return Object.keys(map).map(function (key) {
      return { key: key, value: map[key] };
    });
  }

  function withinPeriod(dateIso, fromKey, toKey) {
    var day = String(dateIso || "").slice(0, 10);
    if (fromKey && day < fromKey) return false;
    if (toKey && day > toKey) return false;
    return true;
  }

  /* ------------------------------------------------------------------ *
   * Sessão / bloqueio de tentativas
   * ------------------------------------------------------------------ */

  function isLocked(user, nowMs) {
    if (!user || !user.lockedUntil) return false;
    return new Date(user.lockedUntil).getTime() > (nowMs || Date.now());
  }

  function registerFailedAttempt(user, nowMs) {
    var current = Number(user.failedAttempts || 0) + 1;
    var now = nowMs || Date.now();
    return {
      failedAttempts: current,
      lockedUntil: current >= 5 ? new Date(now + 15 * 60 * 1000).toISOString() : null
    };
  }

  function resetAttempts() {
    return { failedAttempts: 0, lockedUntil: null };
  }

  /* ------------------------------------------------------------------ *
   * Validação de cadastro
   * ------------------------------------------------------------------ */

  function validateSignup(payload, existingUsers) {
    var data = payload || {};
    var errors = {};
    var name = String(data.name || "").trim();
    var email = String(data.email || "").trim().toLowerCase();

    if (name.length < 3) errors.name = "Informe seu nome completo (mínimo 3 letras).";

        return s.id === updated.id ? updated : s;
      });
      await db.set("products", state.products);
      await persist("sales", state.sales);
      return updated;
    }

    /* -------------------------- DESPESAS -------------------------- */

    async function saveExpense(payload) {
      await ensureLoaded();
      var description = String(payload.description || "").trim();
      if (description.length < 2) throw new Error("Descreva a despesa.");
      var amount = Number(payload.amount);
      if (!isFinite(amount) || amount <= 0) throw new Error("Informe um valor maior que zero.");
      var expense = {
        id: uid(),
        description: description,
        amount: core.round2(amount),
        category: payload.category || "Outros",
        dueDate: payload.dueDate || core.todayKey(),
        paid: payload.paid !== false,
        createdAt: now()
      };
      state.expenses = [expense].concat(state.expenses);
      await persist("expenses", state.expenses);
      return expense;
    }

    async function deleteExpense(id) {
      await ensureLoaded();
      state.expenses = state.expenses.filter(function (e) {
        return e.id !== id;
      });
      await persist("expenses", state.expenses);
      return true;
    }

    async function toggleExpensePaid(id) {
      await ensureLoaded();
      state.expenses = state.expenses.map(function (e) {
        return e.id === id ? Object.assign({}, e, { paid: !e.paid }) : e;
      });
      await persist("expenses", state.expenses);
      return true;
    }

    /* ------------------------ CONFIGURAÇÕES ------------------------ */

    async function saveSettings(patch) {
      await ensureLoaded();
      state.settings = Object.assign({}, state.settings, patch, { updatedAt: now() });
      await persist("settings", state.settings);
      return state.settings;
    }

    /* --------------------------- LEITURA --------------------------- */

    function listProducts() {
      return state.products.slice().sort(function (a, b) {
        return String(a.name).localeCompare(String(b.name), "pt-BR");
      });
    }
    function listCustomers() {
      return state.customers.slice().sort(function (a, b) {
        return String(a.name).localeCompare(String(b.name), "pt-BR");
      });
    }
    function listSales() {
      return state.sales.slice().sort(function (a, b) {
        return String(b.createdAt).localeCompare(String(a.createdAt));
      });
    }
    function listExpenses() {
      return state.expenses.slice().sort(function (a, b) {
        return String(b.createdAt).localeCompare(String(a.createdAt));
      });
    }

    function dashboard(range) {
      var from = range && range.from;
      var to = range && range.to;
      var sales = state.sales.filter(function (s) {
        return s.status === "CONCLUIDA" && core.withinPeriod(s.createdAt, from, to);
      });
      var revenue = core.sumBy(sales, function (s) {
        return s.total;
      });
      var cost = core.sumBy(sales, function (s) {
        return (s.items || []).reduce(function (acc, i) {
          return acc + Number(i.cost || 0) * Number(i.quantity || 0);
        }, 0);
      });
      var expenses = state.expenses.filter(function (e) {
        return e.paid && core.withinPeriod(e.createdAt, from, to);
      });
      var expenseTotal = core.sumBy(expenses, function (e) {
        return e.amount;
      });
      var openDebt = core.sumBy(sales, function (s) {
        return s.balance;
      });
      var topProducts = core
        .groupSum(
          sales.reduce(function (acc, s) {
            return acc.concat(s.items || []);
          }, []),
          function (i) {
            return i.name;
          },
          function (i) {
            return Number(i.quantity) * Number(i.unitPrice || 0);
          }
        )
        .sort(function (a, b) {
          return b.value - a.value;
        })
        .slice(0, 5);
      var byDay = core
        .groupSum(sales, function (s) {
          return String(s.createdAt).slice(0, 10);
        }, function (s) {
          return s.total;
        })
        .sort(function (a, b) {
          return String(a.key).localeCompare(String(b.key));
        });
      return {
        salesCount: sales.length,
        revenue: revenue,
        cost: cost,
        expenses: expenseTotal,
        profit: core.round2(revenue - cost - expenseTotal),
        ticket: sales.length ? core.round2(revenue / sales.length) : 0,
        openDebt: openDebt,
        productsCount: state.products.length,
        lowStock: state.products.filter(function (p) {
          return p.stock <= Number(state.settings.lowStockThreshold || 3);
        }),
        customersCount: state.customers.length,
        topProducts: topProducts,
        byDay: byDay,
        recentSales: sales.slice(0, 5)
      };
    }

    /* ---------------------------- CAIXA ---------------------------- */

    /** Caixa aberto no momento (ou null). */
    function activeCashSession() {
      var open = (state.cashSessions || []).filter(function (c) {
        return c.status === "ABERTO";
      });
      return open.length ? open[open.length - 1] : null;
    }

    function cashTotals(session) {
      var sales = state.sales.filter(function (s) {
        return s.cashSessionId === session.id && s.status === "CONCLUIDA";
      });
      var byMethod = {};
      var received = 0;
      var change = 0;
      var debt = 0;

      sales.forEach(function (sale) {
        var paid = Number(sale.paid) || 0;
        var troco = Number(sale.change) || 0;
        var saldo = Number(sale.balance) || 0;
        var method = sale.paymentMethod || "DINHEIRO";
        byMethod[method] = (byMethod[method] || 0) + (paid - troco);
        received += paid - troco;
        change += troco;
        debt += saldo;
      });

      var retiradas = (session.withdrawals || []).reduce(function (acc, w) {
        return acc + (Number(w.amount) || 0);
      }, 0);
      var suprimentos = (session.supplies || []).reduce(function (acc, w) {
        return acc + (Number(w.amount) || 0);
      }, 0);

      var opening = Number(session.openingAmount) || 0;
      var cashInDrawer = opening + (byMethod.DINHEIRO || 0) + suprimentos - retiradas;

      return {
        salesCount: sales.length,
        sales,
        byMethod: byMethod,
        received: core.round2(received),
        change: core.round2(change),
        debt: core.round2(debt),
        withdrawals: core.round2(retiradas),
        supplies: core.round2(suprimentos),
        opening: core.round2(opening),
        cashInDrawer: core.round2(cashInDrawer),
        expected: core.round2(cashInDrawer),
      };
    }

    async function openCashSession(payload) {
      await ensureLoaded();
      if (activeCashSession()) throw new Error("Já existe um caixa aberto. Feche-o antes de abrir outro.");
      var opening = core.round2(core.parseMoneyInput(payload && payload.openingAmount));
      if (!isFinite(opening) || opening < 0) throw new Error("Valor de abertura inválido.");

      var session = {
        id: uid(),
        openedAt: now(),
        openedBy: currentUser ? currentUser.name : "Operador",
        openingAmount: opening,
        note: String((payload && payload.note) || "").slice(0, 200),
        status: "ABERTO",
        closedAt: null,
        countedAmount: null,
        difference: null,
        withdrawals: [],
        supplies: [],
      };
      state.cashSessions = state.cashSessions.concat([session]);
      await persist("cashSessions", state.cashSessions);
      return session;
    }

    async function closeCashSession(payload) {
      await ensureLoaded();
      var session = activeCashSession();
      if (!session) throw new Error("Não há caixa aberto.");
      var counted = core.round2(core.parseMoneyInput(payload && payload.countedAmount));
      if (!isFinite(counted) || counted < 0) throw new Error("Informe o valor contado na gaveta.");

      var totals = cashTotals(session);
      var closed = Object.assign({}, session, {
        status: "FECHADO",
        closedAt: now(),
        countedAmount: counted,
        expectedAmount: totals.expected,
        difference: core.round2(counted - totals.expected),
        closingNote: String((payload && payload.note) || "").slice(0, 200),
        summary: {
          salesCount: totals.salesCount,
          received: totals.received,
          byMethod: totals.byMethod,
          debt: totals.debt,
          withdrawals: totals.withdrawals,
          supplies: totals.supplies,
        },
      });
      state.cashSessions = state.cashSessions.map(function (c) {
        return c.id === closed.id ? closed : c;
      });
      await persist("cashSessions", state.cashSessions);
      return closed;
    }

    /** Sangria (retirada) ou suprimento (entrada) de dinheiro no caixa. */
    async function cashMovement(kind, payload) {
      await ensureLoaded();
      var session = activeCashSession();
      if (!session) throw new Error("Abra o caixa para registrar movimentações.");
      var amount = core.round2(core.parseMoneyInput(payload && payload.amount));
      if (!isFinite(amount) || amount <= 0) throw new Error("Informe um valor maior que zero.");
      var entry = {
        id: uid(),
        amount: amount,
        reason: String((payload && payload.reason) || "").slice(0, 120),
        at: now(),
      };
      var updated = Object.assign({}, session);
      if (kind === "sangria") {
        updated.withdrawals = (session.withdrawals || []).concat([entry]);
      } else {
        updated.supplies = (session.supplies || []).concat([entry]);
      }
      state.cashSessions = state.cashSessions.map(function (c) {
        return c.id === updated.id ? updated : c;
      });
      await persist("cashSessions", state.cashSessions);
      return updated;
    }

    function listCashSessions(filter) {
      var from = filter && filter.from;
      var to = filter && filter.to;
      return (state.cashSessions || [])
        .filter(function (c) {
          if (!from && !to) return true;
          return core.withinPeriod(c.openedAt, from, to);
        })
        .slice()
        .sort(function (a, b) {
          return String(b.openedAt).localeCompare(String(a.openedAt));
        });
    }

    /** Resumo de um dia específico (para o calendário). */
    function cashDaySummary(dateKey) {
      var sessions = (state.cashSessions || []).filter(function (c) {
        return String(c.openedAt).slice(0, 10) === dateKey;
      });
      var sales = state.sales.filter(function (s) {
        return s.status === "CONCLUIDA" && String(s.createdAt).slice(0, 10) === dateKey;
      });
      var revenue = sales.reduce(function (acc, s) {
        return acc + (Number(s.total) || 0);
      }, 0);
      var cash = sales.reduce(function (acc, s) {
        return acc + (Number(s.paid) - Number(s.change) || 0);
      }, 0);
      return {
        date: dateKey,
        sessions: sessions,
        salesCount: sales.length,
        revenue: core.round2(revenue),
        received: core.round2(cash),
        open: sessions.some(function (c) {
          return c.status === "ABERTO";
        }),
      };
    }

    /** Conteúdo do backup baixado/gravado pelo usuário. */
    async function exportAll() {
      await ensureLoaded();
      return {
        app: "Passarela da Moda",
        format: "passarela-backup",
        exportedAt: now(),
        version: 1,
        settings: state.settings,
        products: state.products,
        customers: state.customers,
        sales: state.sales,
        expenses: state.expenses,
        cashSessions: state.cashSessions
      };
    }

    async function wipeData() {
      await db.clearAll();
      var keepSettings = Object.assign({}, defaultSettings(), {
        profile: state.settings.profile,
        storeName: state.settings.storeName,
        accent: state.settings.accent,
        theme: state.settings.theme
      });
      state.products = [];
      state.customers = [];
      state.sales = [];
      state.expenses = [];
      state.cashSessions = [];
      state.settings = keepSettings;
      currentUser = currentProfile();
      state.users = [currentUser];
      loaded = true;
      await db.set(KEYS.settings, state.settings);
      emit();
      return true;
    }

    /** Importa um backup .json (substitui os dados atuais). */
    async function restoreBackup(payload) {
      await ensureLoaded();
      var data = payload && payload.data ? payload.data : payload;
      if (!data || typeof data !== "object") throw new Error("Arquivo de backup inválido.");
      state.products = Array.isArray(data.products) ? data.products : [];
      state.customers = Array.isArray(data.customers) ? data.customers : [];
      state.sales = Array.isArray(data.sales) ? data.sales : [];
      state.expenses = Array.isArray(data.expenses) ? data.expenses : [];
      state.cashSessions = Array.isArray(data.cashSessions) ? data.cashSessions : [];
      if (data.settings) {
        state.settings = Object.assign({}, defaultSettings(), data.settings);
      }
      currentUser = currentProfile();
      state.users = [currentUser];
      await Promise.all([
        db.set(KEYS.products, state.products),
        db.set(KEYS.customers, state.customers),
        db.set(KEYS.sales, state.sales),
        db.set(KEYS.expenses, state.expenses),
        db.set(KEYS.cashSessions, state.cashSessions),
        db.set(KEYS.settings, state.settings),
      ]);
      emit();
      return {
        products: state.products.length,
        customers: state.customers.length,
        sales: state.sales.length,
      };
    }

    return {
      load: load,
      subscribe: subscribe,
      getState: function () {
        return state;
      },
      getUser: getUser,
      isAuthenticated: isAuthenticated,
      refresh: load,
      restoreBackup: restoreBackup,
      updateProfile: updateProfile,
      saveProduct: saveProduct,
      deleteProduct: deleteProduct,
      adjustStock: adjustStock,
      saveCustomer: saveCustomer,
      deleteCustomer: deleteCustomer,
      createSale: createSale,
      cancelSale: cancelSale,
      receiveDebt: receiveDebt,
      saveExpense: saveExpense,
      deleteExpense: deleteExpense,
      toggleExpensePaid: toggleExpensePaid,
      saveSettings: saveSettings,
      listProducts: listProducts,
      listCustomers: listCustomers,
      listSales: listSales,
      listExpenses: listExpenses,
      dashboard: dashboard,
      activeCashSession: activeCashSession,
      cashTotals: cashTotals,
      openCashSession: openCashSession,
      closeCashSession: closeCashSession,
      cashMovement: cashMovement,
      listCashSessions: listCashSessions,
      cashDaySummary: cashDaySummary,
      exportAll: exportAll,
      wipeData: wipeData,
      KEYS: KEYS
    };
  }

  return { createStore: createStore, KEYS: KEYS };
});

  /** Lê um arquivo de imagem, redimensiona (máx. 512px) e devolve data URL JPEG/PNG. */
  function readImageFile(file, maxSize) {

  /** Gráfico de área suave (SVG) — tendência de faturamento. */

    var pad = 8;

        '<title>' + escapeHtml(p.d.label + ": " + (opts.format ? opts.format(p.d.value) : p.d.value)) + "</title></circle>";
    });

  /**
   * Calendário mensal com marcação de dias (caixa aberto, vendas, faturamento).
   * summaryFn(dateKey) → { open, salesCount, revenue }
   */
  function calendar(monthKey, summaryFn, options) {
    var opts = options || {};
    var parts = String(monthKey).split("-");
    var year = Number(parts[0]);
    var month = Number(parts[1]) - 1;
    var first = new Date(year, month, 1);
    var daysInMonth = new Date(year, month + 1, 0).getDate();
    var startWeekday = first.getDay();
    var todayKey = new Date().toISOString().slice(0, 10);
    var selected = opts.selected || null;

    var monthNames = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];
    var html = '<div class="cal-head"><button class="cal-nav" data-cal="prev" aria-label="Mês anterior">‹</button>' +
      '<strong>' + monthNames[month] + " de " + year + "</strong>" +
      '<button class="cal-nav" data-cal="next" aria-label="Próximo mês">›</button></div>';

    html += '<div class="cal-week">' + ["dom", "seg", "ter", "qua", "qui", "sex", "sáb"].map(function (d) {
      return "<span>" + d + "</span>";
    }).join("") + "</div>";

    html += '<div class="cal-grid">';
    for (var i = 0; i < startWeekday; i++) html += '<span class="cal-empty"></span>';

    for (var day = 1; day <= daysInMonth; day++) {
      var key = year + "-" + String(month + 1).padStart(2, "0") + "-" + String(day).padStart(2, "0");
      var summary = summaryFn ? summaryFn(key) : null;
      var classes = ["cal-day"];
      if (key === todayKey) classes.push("is-today");
      if (key === selected) classes.push("is-selected");
      if (summary && summary.open) classes.push("has-open");
      if (summary && summary.salesCount > 0) classes.push("has-sales");
      if (summary && summary.revenue > 0) classes.push("has-money");

      var title = key;
      if (summary && summary.salesCount) {
        title += " · " + summary.salesCount + " venda(s) · " + (opts.format ? opts.format(summary.revenue) : summary.revenue);
      }
      if (summary && summary.open) title += " · caixa aberto";

      html += '<button class="' + classes.join(" ") + '" data-cal-day="' + key + '" title="' + escapeHtml(title) + '">' +
        '<span class="cal-num">' + day + "</span>" +
        (summary && summary.open ? '<span class="cal-flag">aberto</span>' : "") +
        (summary && summary.revenue > 0 ? '<span class="cal-dot"></span>' : "") +
        "</button>";
    }
    html += "</div>";
    return html;
  }

  /* ---------------------------- MÁSCARAS ---------------------------- */

  function applyMask(input, maskFn) {
    if (!input) return;
    input.addEventListener("input", function () {
      var position = input.selectionStart;
      var before = input.value.length;
      input.value = maskFn(input.value);
      var after = input.value.length;
      if (position !== null) input.setSelectionRange(position + (after - before), position + (after - before));
    });
  }

  function phoneMask(value) {
    var v = String(value || "").replace(/\D/g, "").slice(0, 11);
    if (v.length <= 10) return v.replace(/^(\d{2})(\d)/, "($1) $2").replace(/(\d{4})(\d{1,4})$/, "$1-$2");
    return v.replace(/^(\d{2})(\d)/, "($1) $2").replace(/(\d{5})(\d{1,4})$/, "$1-$2");
  }

  function cpfMask(value) {
    var v = String(value || "").replace(/\D/g, "").slice(0, 11);
    return v.replace(/^(\d{3})(\d)/, "$1.$2").replace(/^(\d{3})\.(\d{3})(\d)/, "$1.$2.$3").replace(/\.(\d{3})(\d{1,2})$/, ".$1-$2");
  }

    document.body.appendChild(link);
    link.click();
    setTimeout(function () {
      URL.revokeObjectURL(url);

    }, 400);
  }

  function downloadFile(filename, content, mime) {

    if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text);

  /** Estado do arquivo no computador, exibido na barra superior. */
  var fileState = { supported: false, linked: false, name: null, status: "off", message: "" };

  function refreshFileState() {
    fileState.supported = typeof dbLib.fileSupported === "function" && dbLib.fileSupported();
    var info = typeof dbLib.fileInfo === "function" ? dbLib.fileInfo() : { linked: false, name: null, status: "off" };
    fileState.linked = info.linked;
    fileState.name = info.name;
    fileState.status = info.status;
    return fileState;
  }

  /** Vincula (cria/abre) o arquivo de dados no computador. Precisa de clique do usuário. */
  async function linkDataFile() {
    var result = await dbLib.linkFile("passarela-da-moda.passarela.json");
    if (!result.ok) {
      if (result.reason === "unsupported") {
        ui.toast(
          "Este navegador não grava direto em arquivo. Use o Chrome ou o Edge, ou clique em Backup para baixar o arquivo.",
          "warning",
          "Sem gravação automática"
        );
      } else if (result.reason === "cancelled") {
        ui.toast("Nenhum arquivo foi escolhido.", "info");
      } else {
        ui.toast(result.message || "Não foi possível criar o arquivo.", "error");
      }
      return false;
    }
    refreshFileState();
    if (result.merged) {
      await store.refresh();
      ui.toast(
        "Dados carregados de " + result.name + " (" + result.entries + " produto(s)). Tudo passa a ser gravado nele.",
        "success",
        "Arquivo importado"
      );
    } else {
      ui.toast("Arquivo vinculado: " + result.name + ". Tudo agora é salvo nele automaticamente.", "success", "Salvando no computador");
      await dbLib.saveNow();
    }
    render();
    return true;
  }

  /** Reabre o arquivo já vinculado (o navegador pede permissão uma vez por sessão). */
  async function reopenDataFile() {
    var result = await dbLib.reopenFile(true);

      if (result.reason === "none") {
        return linkDataFile();

      ui.toast("Permissão não concedida para gravar no arquivo.", "warning");
      return false;

    refreshFileState();
    await store.refresh();
    render();
    ui.toast(
      result.restored
        ? "Dados carregados de " + result.name + " (" + result.entries + " produto(s))."

      "success",
      "Arquivo de dados"
    );
    return true;
  }

      '<div class="kpi-value">' + ui.escapeHtml(value) + "</div>" +
      '<div class="kpi-foot">' + ui.escapeHtml(foot) + "</div></div></div>"

  function thumb(photo, name) {
    if (photo) return '<span class="thumb"><img src="' + ui.escapeHtml(photo) + '" alt=""></span>';
    return '<span class="thumb">' + ui.escapeHtml(ui.initials(name)) + "</span>";
  }

  function customerName(id) {
    if (!id) return "Consumidor final";
    var found = store.getState().customers.find(function (c) { return c.id === id; });
    return found ? found.name : "Consumidor final";
  }

      if (!search) return true;
      return (
        product.name.toLowerCase().indexOf(search) > -1 ||
        String(product.sku).toLowerCase().indexOf(search) > -1 ||
        String(product.category).toLowerCase().indexOf(search) > -1
      );
    });

      ? products.map(function (product) {
          var inCart = cart.find(function (item) { return item.productId === product.id; });

            '<button class="pos-card" data-add="' + product.id + '"' + (product.stock <= 0 ? " disabled" : "") + ">" +
              '<span class="pos-media">' + (product.photo ? '<img src="' + ui.escapeHtml(product.photo) + '" alt="">' : Icons.icon("tag", 26)) + "</span>" +
              '<span class="pos-body"><span class="pos-name">' + ui.escapeHtml(product.name) + "</span>" +
              '<span class="pos-meta">' + ui.escapeHtml([product.size, product.color].filter(Boolean).join(" · ") || product.category) + "</span>" +
              '<span class="row-between"><span class="pos-price">' + core.brl(product.price) + "</span>" +
              '<span class="badge ' + (product.stock <= 0 ? "badge-danger" : product.stock <= 3 ? "badge-warning" : "") + '">' + product.stock + "</span></span>" +
              (inCart ? '<span class="badge badge-accent" style="justify-self:start">no carrinho: ' + inCart.quantity + "</span>" : "") +
              "</span></button>"
          );
        }).join("")
      : ui.emptyState(Icons.icon("products", 22), "Nenhum produto encontrado", search ? "Tente outro termo de busca." : "Cadastre produtos para começar a vender.", '<button class="btn btn-primary btn-sm mt-8" data-nav="products">Cadastrar produto</button>');

    var totals = core.computeSaleTotals({
      items: cart.map(function (item) {
        var product = store.getState().products.find(function (p) { return p.id === item.productId; }) || { price: 0 };
        return { id: item.productId, unitPrice: product.price, quantity: item.quantity };
      }),
      discount: core.parseMoneyInput(aux.posDiscount || ""),
      paidAmount: core.parseMoneyInput(aux.posPaid || "")
    });

    var lines = cart.length
      ? cart.map(function (item) {
          var product = store.getState().products.find(function (p) { return p.id === item.productId; });
          if (!product) return "";
          return (
            '<div class="cart-line">' +
              '<div class="grow" style="min-width:0"><div class="cart-line-name">' + ui.escapeHtml(product.name) + "</div>" +
              '<div class="tiny faint">' + core.brl(product.price) + " cada</div></div>" +
              '<div class="qty"><button data-qty="-1" data-id="' + product.id + '">−</button><span>' + item.quantity + "</span>" +
              '<button data-qty="1" data-id="' + product.id + '">+</button></div>' +
              '<div class="small bold mono" style="width:74px;text-align:right">' + core.brl(product.price * item.quantity) + "</div>" +
            "</div>"
          );
        }).join("")
      : '<div class="empty" style="padding:32px 16px">' + Icons.icon("pos", 22).replace('class=', 'class=') +
        "<h3>Carrinho vazio</h3><p>Clique em um produto para adicionar.</p></div>";

    var customers = store.listCustomers();
    var customerOptions = '<option value="">Consumidor final</option>' + customers.map(function (c) {
      return '<option value="' + c.id + '"' + (aux.posCustomer === c.id ? " selected" : "") + ">" + ui.escapeHtml(c.name) + "</option>";
    }).join("");

    var paymentOptions = Object.keys(PAYMENT_LABELS).map(function (key) {
      return '<option value="' + key + '"' + ((aux.posPayment || "DINHEIRO") === key ? " selected" : "") + ">" + PAYMENT_LABELS[key] + "</option>";
    }).join("");

    return (
      '<div class="pos">' +
        '<div class="stack">' +
          '<div class="card card-pad"><div class="row gap-8 wrap">' +
            '<div class="input-group grow" style="min-width:220px"><span class="icon-left">' + Icons.icon("search", 16) + "</span>" +
            '<input class="input" id="pos-search" placeholder="Buscar por nome, SKU ou categoria..." value="' + ui.escapeHtml(aux.posSearch || "") + '"></div>' +
            '<button class="btn btn-outline btn-sm" data-nav="products">' + Icons.icon("plus", 14) + " Novo produto</button>" +
          "</div></div>" +
          '<div class="pos-grid">' + grid + "</div>" +
        "</div>" +
        '<div class="card cart">' +
          '<div class="card-head"><span class="card-title">Venda atual</span><span class="badge">' + totals.itemCount + " item(ns)</span></div>" +
          '<div class="cart-items">' + lines + "</div>" +
          '<div class="cart-summary">' +
            '<div class="field"><label>Cliente</label><select class="select" id="pos-customer">' + customerOptions + "</select></div>" +
            '<div class="grid grid-2" style="gap:8px">' +
              '<div class="field"><label>Forma de pagamento</label><select class="select" id="pos-payment">' + paymentOptions + "</select></div>" +
              '<div class="field"><label>Desconto (R$)</label><input class="input" id="pos-discount" inputmode="decimal" placeholder="0,00" value="' + ui.escapeHtml(aux.posDiscount || "") + '"></div>' +
            "</div>" +
            '<div class="sum-row"><span>Subtotal</span><span class="mono">' + core.brl(totals.subtotal) + "</span></div>" +
            (Number(totals.discount) > 0 ? '<div class="sum-row"><span>Desconto</span><span class="mono" style="color:var(--danger)">− ' + core.brl(totals.discount) + "</span></div>" : "") +
            '<div class="sum-row total"><span>Total</span><span class="mono">' + core.brl(totals.total) + "</span></div>" +
            '<div class="field"><label>Valor recebido</label><input class="input" id="pos-paid" inputmode="decimal" placeholder="' + core.brl(totals.total) + '" value="' + ui.escapeHtml(aux.posPaid || "") + '"></div>' +
            (Number(totals.change) > 0 ? '<div class="sum-row"><span>Troco</span><span class="mono" style="color:var(--success)">' + core.brl(totals.change) + "</span></div>" : "") +
            (Number(totals.balance) > 0 ? '<div class="sum-row"><span>Falta receber</span><span class="mono" style="color:var(--danger)">' + core.brl(totals.balance) + "</span></div>" : "") +
          "</div>" +
          '<div class="cart-actions">' +
            '<button class="btn btn-primary btn-lg btn-block" id="pos-finalize"' + (cart.length ? "" : " disabled") + ">" +
              Icons.icon("check", 17) + " Finalizar venda</button>" +
            '<div class="row gap-8">' +
              '<button class="btn btn-outline btn-sm grow" id="pos-clear"' + (cart.length ? "" : " disabled") + ">Limpar</button>" +
              '<button class="btn btn-ghost btn-sm grow" data-nav="sales">Ver vendas</button>' +
            "</div>" +
          "</div>" +
        "</div>" +
      "</div>"
    );

  function bindPos() {
    var search = document.getElementById("pos-search");
    if (search) {
      search.addEventListener(
        "input",
        ui.debounce(function () {
          aux.posSearch = search.value;
          var position = search.selectionStart;
          document.getElementById("view").innerHTML = posView();
          bindPos();
          var next = document.getElementById("pos-search");
          if (next) {
            next.focus();
            next.setSelectionRange(position, position);
          }
        }, 180)
      );
    }

    ui.$$("[data-add]").forEach(function (button) {
      button.addEventListener("click", function () {
        addToCart(button.dataset.add);
      });
    });

    ui.$$("[data-qty]").forEach(function (button) {
      button.addEventListener("click", function () {
        changeQty(button.dataset.id, Number(button.dataset.qty));
      });
    });

    var customer = document.getElementById("pos-customer");
    if (customer) customer.addEventListener("change", function () { aux.posCustomer = customer.value; });

    var payment = document.getElementById("pos-payment");
    if (payment) payment.addEventListener("change", function () {
      aux.posPayment = payment.value;
      document.getElementById("view").innerHTML = posView();
      bindPos();
    });

    ["pos-discount", "pos-paid"].forEach(function (id) {
      var input = document.getElementById(id);
      if (!input) return;
      input.addEventListener("change", function () {
        if (id === "pos-discount") aux.posDiscount = input.value;
        else aux.posPaid = input.value;
        document.getElementById("view").innerHTML = posView();
        bindPos();
      });
    });

    var finalize = document.getElementById("pos-finalize");
    if (finalize) finalize.addEventListener("click", finalizeSale);

    var clear = document.getElementById("pos-clear");
    if (clear) clear.addEventListener("click", function () {
      cart = [];
      aux.posPaid = "";
      aux.posDiscount = "";
      refreshPos();
    });
  }

  function refreshPos() {
    document.getElementById("view").innerHTML = posView();
    bindPos();
  }

  function addToCart(productId) {
    var product = store.getState().products.find(function (p) { return p.id === productId; });
    if (!product) return;
    var existing = cart.find(function (item) { return item.productId === productId; });
    if (existing) {
      if (existing.quantity >= product.stock) {
        ui.toast("Estoque disponível: " + product.stock + " un.", "warning", "Limite atingido");
        return;
      }
      existing.quantity += 1;
    } else {
      cart.push({ productId: productId, quantity: 1 });
    }
    refreshPos();
  }

  function changeQty(productId, delta) {
    var item = cart.find(function (line) { return line.productId === productId; });
    if (!item) return;
    var product = store.getState().products.find(function (p) { return p.id === productId; });
    var next = item.quantity + delta;
    if (next > Number(product.stock)) {
      ui.toast("Estoque disponível: " + product.stock + " un.", "warning");
      return;
    }
    if (next <= 0) cart = cart.filter(function (line) { return line.productId !== productId; });
    else item.quantity = next;
    refreshPos();
  }

  async function finalizeSale() {
    if (!cart.length) return;
    var paidText = aux.posPaid;
    var totals = core.computeSaleTotals({
      items: cart.map(function (item) {
        var product = store.getState().products.find(function (p) { return p.id === item.productId; });
        return { id: item.productId, unitPrice: product.price, quantity: item.quantity };
      }),
      discount: core.parseMoneyInput(aux.posDiscount || ""),
      paidAmount: core.parseMoneyInput(paidText || "")
    });
    var paid = paidText ? core.parseMoneyInput(paidText) : Number(totals.total);
    if (totals.balanceCents > 0) {
      var ok = await ui.confirmDialog({
        title: "Registrar como fiado?",
        message: "Faltam " + core.brl(totals.balance) + " para fechar a venda. Confirmar registra o saldo em aberto no nome do cliente.",
        confirmLabel: "Registrar fiado"
      });
      if (!ok) return;
    }
    try {
      var sale = await store.createSale({
        customerId: aux.posCustomer || null,
        items: cart.map(function (item) { return { productId: item.productId, quantity: item.quantity }; }),
        discount: core.parseMoneyInput(aux.posDiscount || ""),
        paidAmount: paid,
        paymentMethod: aux.posPayment || "DINHEIRO",
        allowDebt: true
      });
      cart = [];
      aux.posPaid = "";
      aux.posDiscount = "";
      render();
      ui.toast(sale.code + " concluída · " + core.brl(sale.total), "success", "Venda registrada");
      setTimeout(function () { openReceipt(sale.id); }, 220);
    } catch (err) {
      ui.toast(err.message, "error", "Não foi possível vender");
    }
  }

              "<td>" + ui.escapeHtml(customerName(sale.customerId)) + "</td>" +

    return (
      '<div class="stack">' +
